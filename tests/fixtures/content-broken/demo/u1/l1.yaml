# Deliberately broken (spec v2): every comment marks an error the validator must report.
id: demo.u1.l1
title: 'Broken lesson'
version: 1
concepts: [ohms-law]
estimatedMinutes: 5
params:
  sets:
    - { V: 6, R: 3 }
screens:
  - id: c1 # first screen is not a hook
    type: concept
    body: 'Bad math $\frac{1}{$ here.' # KaTeX error
  - id: e1
    type: explore
    intro: 'A battery and a resistor.'
    interactive:
      type: circuit-builder
      config:
        locked: true
        preset: ['B1 n1 0 V', 'A1 n1 n2', 'R1 n2 0 R']
        controls:
          - { element: R1, param: resistance, min: 1, max: 12, step: 1 }
    tasks:
      - goal: 'Make the ammeter read 2 A.' # already met at the start
        check: { expr: 'near(I_A1, 2)' }
        solution: { R1: 3 }
    takeaway: 'Fact {{Q}}' # unknown symbol Q
  - id: s1
    type: question
    role: core
    concept: ohms-law
    uses: [s2] # points forwards
    variants:
      standard:
        id: s1-s
        kind: numeric
        difficulty: 2
        prompt: 'Current?'
  - id: s2
    type: question
    role: core
    concept: missing-concept # unknown concept
    variants:
      standard:
        id: s2-s
        kind: numeric
        difficulty: 2
        prompt: 'Again?'
  - id: ch1
    type: challenge
    title: 'Wrong solution'
    concept: ohms-law
    interactive: circuit-builder
    variants:
      easier:
        difficulty: 2
        goal: 'Make {{V/R}} A flow.'
        config: { battery: { voltage: 'V' }, palette: [{ kind: resistor, resistance: 'R', count: 2 }] }
        check: { expr: 'near(I, V / R)' }
        hints: { nudge: 'n', partial: 'p' }
        solution: { netlist: ['B1 n1 0', 'R1 n1 n2', 'R2 n2 0'] } # gives V/(2R)
        explanation: 'e'
      standard:
        difficulty: 2 # not strictly increasing
        goal: 'g'
        config: { battery: { voltage: 'V' }, palette: [{ kind: resistor, resistance: 'R', count: 1 }] }
        check: { expr: 'near(I, V / R)' }
        hints: { nudge: 'n', partial: 'p' }
        solution: { netlist: ['B1 n1 0', 'R1 n1 0'] }
        explanation: 'e'
      harder:
        difficulty: 4
        goal: 'g'
        config: { battery: { voltage: 'V' }, palette: [{ kind: resistor, resistance: 'R', count: 1 }] }
        check: { expr: 'near(I, V / R)' }
        hints: { nudge: 'n', partial: 'p' }
        solution: { netlist: ['B1 n1 0', 'R1 n1 0'] }
        explanation: 'e'
  - id: wrap
    type: recap
    takeaways: ['t']
    next: demo.u9.l9 # not a listed lesson
practice: [] # pool too small
