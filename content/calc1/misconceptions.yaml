# Misconceptions for Calculus I.

# ── calc1.u1.l1: functions and their graphs ──
- id: shift-direction
  short: "f(x − h) moves the graph right by h; f(x + h) moves it left. Changes inside the brackets run backwards."
  explain: |
    The new graph reaches f(0) where x − h = 0, i.e. at x = h.
  lessons: [calc1.u1.l1]

- id: shift-axis
  short: "Changes inside f( ) act on x (horizontal); changes outside act on y (vertical)."
  explain: |
    In f(x − h) + k, h is the horizontal shift and k the vertical one.
  lessons: [calc1.u1.l1]

- id: stretch-is-shift
  short: "A factor stretches the graph; adding a number shifts it."
  explain: |
    a·f(x) multiplies every output by a; f(x) + k adds k to every output.
  lessons: [calc1.u1.l1]

- id: shift-is-stretch
  short: "Adding inside the brackets shifts the graph; multiplying x stretches or compresses it."
  explain: |
    f(x − 2) is a shift; f(2x) or f(x/2) change the width.
  lessons: [calc1.u1.l1]

- id: shift-ignored
  short: "Every transformation in the formula moves the graph — none can be skipped."
  explain: |
    Track the vertex (or any point) through each change.
  lessons: [calc1.u1.l1]

- id: shift-vertical-sign
  short: "A + k outside the function moves the graph up by k."
  explain: |
    Vertical changes act as written; only inside changes run backwards.
  lessons: [calc1.u1.l1]

- id: compress-direction
  short: "f(2x) compresses the graph toward the y-axis: features happen at half the x."
  explain: |
    To get f(6) you now need 2x = 6, so x = 3.
  lessons: [calc1.u1.l1]

- id: stretch-shift-order
  short: "In a·f(x) + k, the stretch happens first and the shift is added after."
  explain: |
    The vertex height is k, not a·k.
  lessons: [calc1.u1.l1]

- id: stretch-inverted
  short: "In y = a(x − h)² + k, a is the rise one unit from the vertex — not its reciprocal."
  explain: |
    One step right of the vertex, y increases by a · 1² = a.
  lessons: [calc1.u1.l1]

- id: domain-strict
  short: "Check the endpoint: √0 = 0 is allowed, but ln 0 is not."
  explain: |
    Square roots need ≥ 0; logarithms need > 0; denominators need ≠ 0.
  lessons: [calc1.u1.l1]

- id: domain-ignores-root
  short: "A square root needs a non-negative argument — that restricts the domain."
  explain: |
    Solve "argument ≥ 0".
  lessons: [calc1.u1.l1]

- id: domain-ignores-denominator
  short: "A denominator can't be zero — remove those x-values."
  explain: |
    Combine every restriction: roots, denominators, logs.
  lessons: [calc1.u1.l1]

- id: domain-combines-wrong
  short: "Combine restrictions by removing only the excluded points — don't discard whole intervals."
  explain: |
    x ≥ h with x ≠ h + 2 keeps everything from h onward except one point.
  lessons: [calc1.u1.l1]

- id: domain-one-branch
  short: "x² > c² has two solution pieces: x > c and x < −c."
  explain: |
    Large negative x work too, because their squares are large.
  lessons: [calc1.u1.l1]

- id: domain-inequality-flip
  short: "Check the direction of the inequality: test a value from your answer."
  explain: |
    Multiplying or dividing by a negative, or a minus in front of x, reverses it.
  lessons: [calc1.u1.l1]

- id: range-is-domain
  short: "The range is the set of outputs, not the set of allowed inputs."
  explain: |
    Find the smallest and largest values f actually takes.
  lessons: [calc1.u1.l1]

- id: range-ignores-shift
  short: "A vertical shift moves every output, including the minimum."
  explain: |
    x² + 1 has minimum 1, not 0.
  lessons: [calc1.u1.l1]

- id: range-ignores-reflection
  short: "A negative coefficient flips the graph: a minimum becomes a maximum."
  explain: |
    −(x − h)² ≤ 0, so the outputs lie *below* the vertex.
  lessons: [calc1.u1.l1]

- id: range-uses-h
  short: "h shifts the graph sideways, so it can't change the outputs' bounds."
  explain: |
    The vertical position comes from k.
  lessons: [calc1.u1.l1]

- id: range-one-branch
  short: "Both branches count: 1/(x − h) is negative to the left of h and positive to the right."
  explain: |
    Together they cover every value except 0.
  lessons: [calc1.u1.l1]

- id: composition-order
  short: "f ∘ g means apply g first, then f: f(g(x))."
  explain: |
    Work from the inside out.
  lessons: [calc1.u1.l1]

- id: composition-multiply
  short: "Composition feeds one function into the other — it isn't multiplication."
  explain: |
    (f ∘ g)(x) = f(g(x)), not f(x)·g(x).
  lessons: [calc1.u1.l1]

- id: composition-one-function
  short: "Both functions must be applied, the inner one first."
  explain: |
    f(g(2)): compute g(2), then put it into f.
  lessons: [calc1.u1.l1]

- id: composition-domain-outer
  short: "The composite's domain comes from requiring g(x) to be in f's domain — not f's domain itself."
  explain: |
    For √(h − x), you need h − x ≥ 0.
  lessons: [calc1.u1.l1]

- id: composition-domain-inner
  short: "The inner function's output must suit the outer function."
  explain: |
    g may accept every x, but f(g(x)) may not.
  lessons: [calc1.u1.l1]

- id: square-distributes
  short: "(a − b)² is not a² ± b²: expand it as a² − 2ab + b² — keep the cross term."
  explain: |
    Multiply (a − b)(a − b) term by term.
  lessons: [calc1.u1.l1]

- id: inverse-is-f
  short: "f⁻¹(7) asks which input gives output 7 — not f(7)."
  explain: |
    Solve f(x) = 7.
  lessons: [calc1.u1.l1]

- id: inverse-reciprocal
  short: "f⁻¹ is the inverse function, not 1/f."
  explain: |
    It undoes f: f⁻¹(f(x)) = x.
  lessons: [calc1.u1.l1]

- id: inverse-order
  short: "Undo the steps in reverse order: the last thing f does is undone first."
  explain: |
    f(x) = 3x − h: add h first, then divide by 3.
  lessons: [calc1.u1.l1]

- id: inverse-negate
  short: "Negating doesn't undo multiplication — divide instead."
  explain: |
    Check by composing: f(f⁻¹(x)) must be x.
  lessons: [calc1.u1.l1]

- id: inverse-impossible
  short: "Squares can be undone with √ on a restricted domain."
  explain: |
    Restrict to one side of the vertex so the function is one-to-one.
  lessons: [calc1.u1.l1]

- id: inverse-linear-only
  short: "Many non-linear functions have inverses — e.g. eˣ and ln x."
  explain: |
    What matters is being one-to-one.
  lessons: [calc1.u1.l1]

# ── calc1.u1.l2: the idea of a limit ──
- id: limit-equals-value
  short: "The limit always equals f(a)? No — the limit ignores x = a; f(a) can be different or undefined."
  explain: |
    Only continuous functions have lim f(x) = f(a).
  lessons: [calc1.u1.l2]

- id: undefined-no-limit
  short: "f(a) being undefined doesn't stop the limit from existing."
  explain: |
    The limit only looks at x near a, never at a itself.
  lessons: [calc1.u1.l2]

- id: limit-needs-value
  short: "A limit can exist even where f(a) is undefined."
  explain: |
    (x² − 4)/(x − 2) has limit 4 at 2, though it is undefined there.
  lessons: [calc1.u1.l2]

- id: limit-must-match-value
  short: "A limit and a value that disagree mean a discontinuity, not a missing limit."
  explain: |
    The limit can exist and differ from f(a).
  lessons: [calc1.u1.l2]

- id: one-sided-must-match-value
  short: "One-sided limits don't have to equal f(a) — they only need to agree with each other for the limit to exist."
  explain: |
    Matching f(a) as well is continuity, a stronger condition.
  lessons: [calc1.u1.l2]

- id: limit-is-input
  short: "The limit is the value f(x) approaches, not the value x approaches."
  explain: |
    Read the outputs, not the inputs.
  lessons: [calc1.u1.l2]

- id: limit-nearest-value
  short: "A table entry is only an approximation — the limit is what the entries close in on."
  explain: |
    Look at the trend as x gets closer from both sides.
  lessons: [calc1.u1.l2]

- id: limit-nearest-value-far
  short: "Use the entries closest to a, from both sides — they show the trend best."
  explain: |
    x = 2.1 is farther from 2 than x = 2.01.
  lessons: [calc1.u1.l2]

- id: limit-average
  short: "Limits aren't averages of the two sides or of anything else."
  explain: |
    If the sides disagree, the limit does not exist.
  lessons: [calc1.u1.l2]

- id: limit-substitute-part
  short: "Substituting into part of a formula doesn't give the limit."
  explain: |
    Simplify the whole expression first, or look at the trend.
  lessons: [calc1.u1.l2]

- id: limit-attained
  short: "A function can approach L without ever equalling it."
  explain: |
    x + 1 for x ≠ 2 approaches 3 but never equals 3.
  lessons: [calc1.u1.l2]

- id: zero-over-zero-zero
  short: "0/0 isn't 0 — it's a signal to simplify; the limit can be any number."
  explain: |
    Factor or rationalize, then take the limit.
  lessons: [calc1.u1.l2]

- id: table-proves-limit
  short: "A table only suggests a limit — it can miss what happens between the sampled points."
  explain: |
    Check with algebra or a graph.
  lessons: [calc1.u1.l2]

- id: sin-near-zero
  short: "sin(π/x) or sin(1/x) near 0 has a huge input, not a small one — it doesn't approach 0."
  explain: |
    Only sin(u) with u → 0 approaches 0.
  lessons: [calc1.u1.l2]

- id: one-sided-direction
  short: "x → a⁻ means from the left (x < a); x → a⁺ means from the right (x > a)."
  explain: |
    Use the piece of the function that applies on that side.
  lessons: [calc1.u1.l2]

- id: one-sided-negates
  short: "The ⁻ in a⁻ means \"from the left\", not \"make it negative\"."
  explain: |
    Plug in values just below a.
  lessons: [calc1.u1.l2]

- id: one-sided-is-limit
  short: "One side alone gives a one-sided limit; the two-sided limit needs both sides to agree."
  explain: |
    Check the other side before naming the limit.
  lessons: [calc1.u1.l2]

- id: abs-ignored
  short: "|x − a| equals −(x − a) when x < a — the sign flips on the left."
  explain: |
    Split absolute values at the point where the inside is 0.
  lessons: [calc1.u1.l2]

- id: sign-slip
  short: "Recheck the sign when you move a term across the equation."
  explain: |
    Substitute your answer back in to confirm.
  lessons: [calc1.u1.l2]

- id: blowup-is-zero
  short: "Dividing by a tiny number gives a huge number, not 0."
  explain: |
    1/0.001 = 1000.
  lessons: [calc1.u1.l2]

- id: blowup-is-one
  short: "Nothing pins the value near 1 — the fraction grows without bound."
  explain: |
    Try values ever closer to a and watch the outputs.
  lessons: [calc1.u1.l2]

- id: square-sign
  short: "A square is never negative, so 1/(x − a)² is positive on both sides."
  explain: |
    Both sides go to +∞.
  lessons: [calc1.u1.l2]

- id: oscillation-is-blowup
  short: "sin(1/x) stays between −1 and 1; it fails by oscillating, not by growing."
  explain: |
    It hits 1 and −1 infinitely often near 0.
  lessons: [calc1.u1.l2]

# ── calc1.u1.l3: computing limits ──
- id: coefficient-dropped
  short: "3x means 3 times x — substitute into every x, including the ones with coefficients."
  explain: |
    At x = 2, 3x = 6.
  lessons: [calc1.u1.l3]

- id: substitute-one-term
  short: "Substitute into every term of the expression, top and bottom."
  explain: |
    Missing a term changes the value.
  lessons: [calc1.u1.l3]

- id: quotient-law-drops-denominator
  short: "The quotient law keeps the denominator: lim f/g = (lim f)/(lim g) when lim g ≠ 0."
  explain: |
    Divide by the denominator's limit.
  lessons: [calc1.u1.l3]

- id: quotient-law-inverted
  short: "Keep the fraction the right way up: numerator over denominator."
  explain: |
    Check which limit is on top.
  lessons: [calc1.u1.l3]

- id: limit-law-sign
  short: "Track signs through each limit law: (−2)² = +4, and 3 + (−2) = 1."
  explain: |
    Substitute with brackets around negative values.
  lessons: [calc1.u1.l3]

- id: cancel-terms
  short: "You can only cancel common factors, never individual terms of a sum."
  explain: |
    (x² + 1)/(x + 1) doesn't simplify: x + 1 is not a factor of x² + 1.
  lessons: [calc1.u1.l3]

- id: zero-over-zero-one
  short: "0/0 isn't 1 — \"anything over itself\" only holds for equal non-zero values."
  explain: |
    Simplify, then take the limit.
  lessons: [calc1.u1.l3]

- id: zero-over-zero-recognition
  short: "Substitute into the numerator and the denominator separately to recognise 0/0."
  explain: |
    Both must be 0 for the form to be 0/0.
  lessons: [calc1.u1.l3]

- id: nonzero-over-zero-indeterminate
  short: "Only 0/0 (and a few others) are indeterminate; nonzero/0 means a blow-up."
  explain: |
    No algebra will turn 5/0 into a finite limit.
  lessons: [calc1.u1.l3]

- id: cancel-wrong-factor
  short: "Cancel exactly the common factor, then substitute into what is left."
  explain: |
    (x − 3)(x + 3)/(x − 3) = x + 3, not x.
  lessons: [calc1.u1.l3]

- id: cancel-half
  short: "After cancelling, every remaining factor still counts — top and bottom."
  explain: |
    Substitute into all of it.
  lessons: [calc1.u1.l3]

- id: cancel-all-factors
  short: "Cancel only as many factors as appear on both sides."
  explain: |
    One (x − a) on top cancels one of the two below.
  lessons: [calc1.u1.l3]

- id: cancel-then-forget-substitute
  short: "After cancelling, you still have to substitute x = a."
  explain: |
    The limit is the value of the simplified expression at a.
  lessons: [calc1.u1.l3]

- id: factor-sign
  short: "Check factor signs by expanding: (x − 2)(x + 1) = x² − x − 2."
  explain: |
    The roots of the quadratic are where each factor is 0.
  lessons: [calc1.u1.l3]

- id: factor-sign-product
  short: "The constant term is the product of the factors' constants — mind the signs."
  explain: |
    (x − 2)(x − 1) gives +2, not −2.
  lessons: [calc1.u1.l3]

- id: factor-incomplete
  short: "A factorisation must be a product; a leftover \"− 2\" means nothing can cancel."
  explain: |
    Write the whole expression as (x − r₁)(x − r₂).
  lessons: [calc1.u1.l3]

- id: conjugate-same-sign
  short: "Multiply by the conjugate — the same terms with the opposite sign between them."
  explain: |
    (√x − 2)(√x + 2) = x − 4 removes the root.
  lessons: [calc1.u1.l3]

- id: conjugate-denominator
  short: "Multiplying by the denominator doesn't remove the root; the conjugate does."
  explain: |
    Aim for a difference of squares.
  lessons: [calc1.u1.l3]

- id: conjugate-partial
  short: "Multiplying by √x alone leaves a root; use the full conjugate √x + 2."
  explain: |
    Only the conjugate gives a difference of squares.
  lessons: [calc1.u1.l3]

- id: conjugate-half
  short: "After rationalising, the conjugate √x + √a tends to 2√a — both terms count."
  explain: |
    Don't drop one of the two equal terms.
  lessons: [calc1.u1.l3]

- id: limit-exists-any-k
  short: "A finite limit with a denominator → 0 needs the numerator → 0 too."
  explain: |
    Otherwise the quotient blows up.
  lessons: [calc1.u1.l3]

# ── calc1.u1.l3: computing limits ──
- id: root-zero-missed
  short: "A root term can vanish too: √4 − 2 = 0, so that numerator is 0 at x = 0."
  explain: |
    Substitute into the root before deciding.
  lessons: [calc1.u1.l3]

- id: cube-zero-missed
  short: "x³ − 8 is 0 at x = 2 (2³ = 8), and x² − 4 is 0 there too — that's 0/0."
  explain: |
    Evaluate powers carefully before judging the form.
  lessons: [calc1.u1.l3]

# ── calc1.u1.l4: limits at infinity & asymptotes ──
- id: infinity-over-infinity-one
  short: "∞/∞ isn't 1 — it's indeterminate. Compare how fast the top and bottom grow."
  explain: |
    Divide top and bottom by the highest power of x in the denominator.
  lessons: [calc1.u1.l4]

- id: dominant-term-biggest-coefficient
  short: "For large x the highest power wins, whatever the coefficients."
  explain: |
    x³ eventually beats 300x²: at x = 1000, x³ is already larger.
  lessons: [calc1.u1.l4]

- id: dominant-term-adds
  short: "The leading terms divide; their coefficients don't add."
  explain: |
    (3x² + 1)/(x² + 5) → 3/1.
  lessons: [calc1.u1.l4]

- id: dominant-terms-constants
  short: "The constant terms matter least for large x — the leading terms decide."
  explain: |
    Divide by the highest power: constants become c/xⁿ → 0.
  lessons: [calc1.u1.l4]

- id: dominant-terms-ignore-degree
  short: "Compare degrees first: the ratio of leading coefficients only applies when the degrees are equal."
  explain: |
    A lower degree on top gives 0.
  lessons: [calc1.u1.l4]

- id: dominant-terms-wrong-power
  short: "Pair the leading terms of the same power: x² on top with x² below."
  explain: |
    Divide every term by the same highest power.
  lessons: [calc1.u1.l4]

- id: dominant-terms-ignore-coefficient
  short: "Use both leading coefficients: Ax² over 2x² tends to A/2, not A."
  explain: |
    Divide top and bottom by x².
  lessons: [calc1.u1.l4]

- id: end-behaviour-constant
  short: "The constant term is negligible for large |x|; the leading term decides the end behaviour."
  explain: |
    A polynomial of degree ≥ 1 never levels off.
  lessons: [calc1.u1.l4]

- id: end-behaviour-coefficient
  short: "The leading coefficient sets the sign, but x³ still grows without bound."
  explain: |
    x³(−2 + …) → −∞, not −2.
  lessons: [calc1.u1.l4]

- id: end-behaviour-sign-ignored
  short: "Odd powers change sign: x³ is negative for negative x."
  explain: |
    Check the sign of the leading term at each end separately.
  lessons: [calc1.u1.l4]

- id: higher-degree-zero
  short: "A higher degree on top makes the function grow, not tend to 0."
  explain: |
    y = 0 comes from a *lower* degree on top.
  lessons: [calc1.u1.l4]

- id: sqrt-x-squared-is-x
  short: "√(x²) = |x|, which is −x for negative x."
  explain: |
    Signs matter at x → −∞.
  lessons: [calc1.u1.l4]

- id: asymptote-from-denominator-root
  short: "Denominator roots give vertical asymptotes (x = c), not horizontal ones."
  explain: |
    Horizontal asymptotes come from x → ±∞.
  lessons: [calc1.u1.l4]

- id: asymptote-equal-degree-none
  short: "Equal degrees do give a horizontal asymptote: the ratio of leading coefficients."
  explain: |
    Only a higher degree on top rules one out.
  lessons: [calc1.u1.l4]

- id: asymptote-axis-confusion
  short: "Horizontal asymptotes are lines y = L (behaviour at the ends); vertical ones are x = c (blow-ups)."
  explain: |
    Name the right kind of line.
  lessons: [calc1.u1.l4]

- id: asymptote-always-at-zero
  short: "Vertical asymptotes are where the denominator is zero — not automatically at x = 0."
  explain: |
    Solve "denominator = 0".
  lessons: [calc1.u1.l4]

- id: asymptote-factor-missed
  short: "Every uncancelled zero of the denominator gives a vertical asymptote — check each factor."
  explain: |
    b·x·(x − c) is zero at x = 0 and at x = c.
  lessons: [calc1.u1.l4]

- id: asymptote-from-numerator
  short: "Zeros of the numerator are where f = 0 (x-intercepts), not asymptotes."
  explain: |
    Asymptotes come from the denominator.
  lessons: [calc1.u1.l4]

- id: asymptote-hole-confusion
  short: "A factor that cancels gives a hole, not a vertical asymptote."
  explain: |
    Check whether the numerator is also zero there.
  lessons: [calc1.u1.l4]

- id: sign-count-error
  short: "Count the negative factors: two negatives make a positive."
  explain: |
    Find the sign of each factor on the side you approach from.
  lessons: [calc1.u1.l4]

- id: asymptote-never-crossed
  short: "Graphs can cross horizontal asymptotes; only the ends must approach them."
  explain: |
    Solve f(x) = L to find crossings.
  lessons: [calc1.u1.l4]

- id: asymptote-crossing-at-infinity
  short: "A crossing happens at a finite x — solve f(x) = L."
  explain: |
    The asymptote itself describes x → ±∞.
  lessons: [calc1.u1.l4]

- id: slant-drops-constant
  short: "Divide every term: (x² + cx + 1)/x = x + c + 1/x, so the line is y = x + c."
  explain: |
    Only the 1/x part vanishes.
  lessons: [calc1.u1.l4]

- id: slant-none
  short: "No horizontal asymptote doesn't mean no asymptote: a slanted line can still fit the ends."
  explain: |
    When the top degree is one more, divide to find y = mx + k.
  lessons: [calc1.u1.l4]

- id: asymptote-fast-approach
  short: "Approaching an asymptote can be very slow: a gap like 5/x needs x ≈ 500 to drop below 0.01."
  explain: |
    Estimate the gap f(x) − L, then solve for x.
  lessons: [calc1.u1.l4]

# ── calc1.u1.l5: continuity ──
- id: continuity-limit-only
  short: "A limit existing isn't enough for continuity — f(a) must exist and equal it."
  explain: |
    Check all three: defined, limit exists, equal.
  lessons: [calc1.u1.l5]

- id: continuity-defined-only
  short: "Being defined at a isn't enough — the limit must exist and equal f(a)."
  explain: |
    A jump or a misplaced point is defined but discontinuous.
  lessons: [calc1.u1.l5]

- id: continuity-ignores-denominator
  short: "A quotient is discontinuous where its denominator is 0."
  explain: |
    Remove those points from the set where f is continuous.
  lessons: [calc1.u1.l5]

- id: continuity-one-side
  short: "Continuity holds on every interval where the formula is defined — both sides of a gap."
  explain: |
    Only the gap itself is excluded.
  lessons: [calc1.u1.l5]

- id: continuity-needs-both-sides
  short: "At an endpoint of the domain, continuity uses only the side where f is defined."
  explain: |
    √(x − a) is continuous at a from the right.
  lessons: [calc1.u1.l5]

- id: zero-is-undefined
  short: "A value of 0 is a perfectly good value — \"undefined\" means no value at all."
  explain: |
    √0 = 0 is defined.
  lessons: [calc1.u1.l5]

- id: root-discontinuous
  short: "Square roots are continuous on their domain."
  explain: |
    They're only undefined for negative arguments.
  lessons: [calc1.u1.l5]

- id: hole-is-jump
  short: "A hole has the same limit from both sides; a jump has different one-sided limits."
  explain: |
    Compare the left and right limits.
  lessons: [calc1.u1.l5]

- id: jump-is-removable
  short: "A jump can't be fixed by redefining one point — the sides disagree."
  explain: |
    Removable means the two-sided limit exists.
  lessons: [calc1.u1.l5]

- id: jump-is-infinite
  short: "A jump has finite one-sided limits; an infinite discontinuity blows up."
  explain: |
    Check whether the values stay bounded near the point.
  lessons: [calc1.u1.l5]

- id: piecewise-match-slope
  short: "Continuity needs the pieces to meet (equal values), not equal slopes."
  explain: |
    Set the two pieces equal at the join.
  lessons: [calc1.u1.l5]

- id: piecewise-forget-x
  short: "Substitute x = a into each piece: m·x becomes m·a."
  explain: |
    Then solve for m.
  lessons: [calc1.u1.l5]

- id: ivt-needs-formula
  short: "The IVT needs only continuity and the end values — no formula."
  explain: |
    A continuous graph can't skip values.
  lessons: [calc1.u1.l5]

- id: ivt-polynomial-only
  short: "The IVT holds for every continuous function, not just polynomials — and it's about the interval given."
  explain: |
    Check continuity on [p, q] and the end values.
  lessons: [calc1.u1.l5]

- id: ivt-gives-location
  short: "The IVT says a value is reached somewhere in the interval — not where."
  explain: |
    Bisection or other methods are needed to locate it.
  lessons: [calc1.u1.l5]

- id: ivt-sign-change-needed
  short: "For a root, the IVT needs a sign change: 0 must lie between f(p) and f(q)."
  explain: |
    Two values of the same sign guarantee nothing.
  lessons: [calc1.u1.l5]

- id: ivt-ignores-continuity
  short: "The IVT requires continuity on the whole closed interval."
  explain: |
    A blow-up or a gap lets the function skip values.
  lessons: [calc1.u1.l5]

- id: ivt-interval-size
  short: "The width of the interval doesn't matter; continuity does."
  explain: |
    Check the hypothesis, not the size.
  lessons: [calc1.u1.l5]

- id: ivt-positive-only
  short: "The IVT works for any value between f(p) and f(q), including 0 across a sign change."
  explain: |
    Sign changes are its main use.
  lessons: [calc1.u1.l5]

- id: ivt-outside-range
  short: "The IVT only guarantees values between f(p) and f(q)."
  explain: |
    Values outside that range may never be reached.
  lessons: [calc1.u1.l5]

- id: ivt-root-only
  short: "The IVT isn't only about roots: any value N between the end values is taken."
  explain: |
    Roots are the case N = 0.
  lessons: [calc1.u1.l5]

- id: ivt-uniqueness
  short: "The IVT guarantees at least one solution, not exactly one."
  explain: |
    A wiggly continuous function can cross a value several times.
  lessons: [calc1.u1.l5]

- id: ivt-monotone
  short: "Continuity doesn't make a function increasing."
  explain: |
    Only the end values are known.
  lessons: [calc1.u1.l5]

- id: bisection-wrong-half
  short: "Keep the half whose endpoints have opposite signs — that's where the IVT traps the root."
  explain: |
    Compare the sign at the midpoint with the sign at an end.
  lessons: [calc1.u1.l5]

- id: bisection-no-halving
  short: "After testing the midpoint, the bracket shrinks to one half; the next test is that half's midpoint."
  explain: |
    Each step halves the bracket.
  lessons: [calc1.u1.l5]

- id: bisection-endpoint
  short: "Bisection tests midpoints, not endpoints."
  explain: |
    The endpoints are already known.
  lessons: [calc1.u1.l5]

- id: bisection-linear
  short: "Bisection halves the bracket; it doesn't creep along in fixed steps."
  explain: |
    After n steps the length is L/2ⁿ.
  lessons: [calc1.u1.l5]

- id: bisection-off-by-one
  short: "Check the boundary case: the length must be *below* the tolerance."
  explain: |
    Compute L/2ⁿ for n and n − 1.
  lessons: [calc1.u1.l5]

- id: bisection-halves-tolerance
  short: "Halving the interval isn't halving the tolerance — count steps until L/2ⁿ < tolerance."
  explain: |
    1/2⁷ ≈ 0.0078 < 0.01.
  lessons: [calc1.u1.l5]

- id: bisection-ignores-length
  short: "Start from the actual bracket length: L/2ⁿ, not 1/2ⁿ."
  explain: |
    A length-4 bracket needs two extra halvings compared with length 1.
  lessons: [calc1.u1.l5]

# ── calc1.u1.l6: squeeze theorem & trig limits ──
- id: squeeze-adds-bounds
  short: "The squeezed function gets the bounds' common limit — the bounds aren't combined."
  explain: |
    If both bounds go to 5, so does f.
  lessons: [calc1.u1.l6]

- id: squeeze-gives-zero
  short: "The squeeze gives whatever common limit the bounds have — not always 0."
  explain: |
    Find the limits of the bounds.
  lessons: [calc1.u1.l6]

- id: squeeze-bounds-dont-converge
  short: "Bounds only prove a limit if they approach the same value."
  explain: |
    ±1 never meet; ±x² both go to 0.
  lessons: [calc1.u1.l6]

- id: squeeze-wrong-lower-bound
  short: "A bound must hold for every x near a: sin(1/x) is often negative, so 0 is not a lower bound."
  explain: |
    Start from −1 ≤ sin ≤ 1.
  lessons: [calc1.u1.l6]

- id: squeeze-wrong-lower-bound-flip
  short: "Check the inequality direction: x² is an upper bound for x² sin(1/x), not a lower one."
  explain: |
    Multiply −1 ≤ sin(1/x) ≤ 1 by x² ≥ 0.
  lessons: [calc1.u1.l6]

- id: squeeze-bound-kept
  short: "A bounded term over a growing one vanishes: the bound itself doesn't stay in the answer."
  explain: |
    |m cos(x²)/x²| ≤ m/x² → 0.
  lessons: [calc1.u1.l6]

- id: product-law-without-limits
  short: "The product law needs each factor to have a limit; cos(∞) is not a number."
  explain: |
    Use the squeeze when a factor only stays bounded.
  lessons: [calc1.u1.l6]

- id: oscillating-factor-no-limit
  short: "An oscillating factor times something going to 0 still goes to 0."
  explain: |
    Bound it: |x cos(1/x)| ≤ |x|.
  lessons: [calc1.u1.l6]

- id: sinx-over-x-everywhere
  short: "sin x / x → 1 only as x → 0; as x → ∞ it goes to 0."
  explain: |
    Check where x is heading.
  lessons: [calc1.u1.l6]

- id: trig-degrees
  short: "sin x / x → 1 needs radians; in degrees the limit is π/180."
  explain: |
    Calculus uses radians for this reason.
  lessons: [calc1.u1.l6]

- id: trig-limit-ignores-inner
  short: "Match the inside: sin(kx)/x = k · sin(kx)/(kx) → k, not 1."
  explain: |
    The argument of sin must match the denominator.
  lessons: [calc1.u1.l6]

- id: trig-limit-multiply
  short: "Inner factors divide: sin(kx)/sin(mx) → k/m."
  explain: |
    Write each sine as (its argument) × sin(u)/u.
  lessons: [calc1.u1.l6]

- id: trig-limit-drops-coefficient
  short: "Keep every coefficient: tan(kx)/(mx) → k/m."
  explain: |
    Only the sin(u)/u part becomes 1.
  lessons: [calc1.u1.l6]

- id: trig-inner-not-squared
  short: "With x² below, the inner factor comes out squared: x² = u²/k²."
  explain: |
    (1 − cos kx)/x² → k²/2.
  lessons: [calc1.u1.l6]

- id: trig-substitute-part
  short: "Replacing only cos x by 1 leaves 0/0, not 0."
  explain: |
    Rewrite with 1 + cos x first.
  lessons: [calc1.u1.l6]

- id: cos-limit-like-sin
  short: "(1 − cos x)/x → 0, not 1 — the cosine limit differs from the sine one."
  explain: |
    1 − cos x ≈ x²/2 near 0.
  lessons: [calc1.u1.l6]

- id: cos-limit-wrong-power
  short: "(1 − cos x)/x → 0 but (1 − cos x)/x² → 1/2 — the power in the denominator matters."
  explain: |
    1 − cos x ≈ x²/2.
  lessons: [calc1.u1.l6]

- id: tan-limit-angle
  short: "tan x / x → 1 as x → 0; π/4 is just where tan equals 1."
  explain: |
    tan x = sin x / cos x.
  lessons: [calc1.u1.l6]

- id: squeeze-vs-sin-limit
  short: "x sin(1/x) → 0 as x → 0 (squeeze), but → 1 as x → ∞ (sin u/u)."
  explain: |
    Check where x is heading.
  lessons: [calc1.u1.l6]

- id: sin-distributes
  short: "sin(4x) ≠ 4 sin x — sine doesn't distribute over multiplication."
  explain: |
    Keep the argument together: u = 4x.
  lessons: [calc1.u1.l6]

# ── calc1.u1.l7: the ε–δ definition ──
- id: epsilon-delta-order
  short: "ε comes first: for every tolerance ε, you must find a window δ."
  explain: |
    δ answers ε and may depend on it.
  lessons: [calc1.u1.l7]

- id: epsilon-delta-free
  short: "ε isn't yours to choose — the definition must hold for every ε > 0."
  explain: |
    Only δ is picked in response.
  lessons: [calc1.u1.l7]

- id: epsilon-delta-fixed
  short: "ε and δ aren't fixed numbers: ε is any positive tolerance, δ is computed from it."
  explain: |
    A proof gives δ as a formula in ε.
  lessons: [calc1.u1.l7]

- id: epsilon-delta-converse
  short: "The implication runs from close inputs to close outputs, not the other way."
  explain: |
    0 < |x − a| < δ ⇒ |f(x) − L| < ε.
  lessons: [calc1.u1.l7]

- id: epsilon-delta-some
  short: "It must hold for every x in the window — and for every ε. One example proves nothing."
  explain: |
    Look for the worst x in the window.
  lessons: [calc1.u1.l7]

- id: epsilon-delta-zero-clause
  short: "0 < |x − a| excludes x = a itself; δ > 0 is a separate condition."
  explain: |
    The limit ignores the value at a.
  lessons: [calc1.u1.l7]

- id: delta-equals-epsilon
  short: "δ and ε measure different axes: the slope converts input gaps into output gaps."
  explain: |
    For a line, δ = ε/|m|.
  lessons: [calc1.u1.l7]

- id: delta-multiplies
  short: "Divide by the slope: outputs move |m| times as far as inputs, so δ = ε/|m|."
  explain: |
    A steeper graph needs a narrower window.
  lessons: [calc1.u1.l7]

- id: delta-divides-by-limit
  short: "The size of L doesn't matter — the slope does."
  explain: |
    |f(x) − L| = |m||x − a| for a line.
  lessons: [calc1.u1.l7]

- id: delta-negative-slope
  short: "δ is a distance, so it's positive: use |m|."
  explain: |
    The absolute value removes the sign of the slope.
  lessons: [calc1.u1.l7]

- id: epsilon-delta-increasing-only
  short: "The definition works for any function — decreasing lines included."
  explain: |
    Use |m| for the slope's size.
  lessons: [calc1.u1.l7]

- id: delta-unique
  short: "Any δ smaller than a working one also works — δ isn't unique."
  explain: |
    Shrinking the window can only help.
  lessons: [calc1.u1.l7]

- id: delta-epsilon-locked
  short: "The band (ε) is fixed by the challenger; a narrower window (δ) still fits it."
  explain: |
    Smaller δ, same ε — still fine.
  lessons: [calc1.u1.l7]

- id: epsilon-too-small
  short: "To disprove a limit you need one ε that no δ can meet; a small ε is exactly the tool."
  explain: |
    The true limit survives every ε, however small.
  lessons: [calc1.u1.l7]

- id: abs-distributes
  short: "The absolute value applies to the whole expression: |x² − 9| ≠ |x|² − 9."
  explain: |
    Factor inside first: |x − 3||x + 3|.
  lessons: [calc1.u1.l7]

- id: square-root-drop
  short: "x² − 9 isn't x − 9 — keep the square and factor it."
  explain: |
    Difference of squares: (x − 3)(x + 3).
  lessons: [calc1.u1.l7]

- id: delta-bound-ignores-window
  short: "Bound the extra factor over the whole window, not just at x = a."
  explain: |
    With |x − a| < 1, |x + a| can reach 2a + 1.
  lessons: [calc1.u1.l7]

- id: delta-bound-wrong-factor
  short: "Bound the factor that appears: |x + a|, not |x|."
  explain: |
    If x < a + 1, then x + a < 2a + 1.
  lessons: [calc1.u1.l7]

- id: delta-bound-is-delta
  short: "The restriction δ ≤ 1 bounds the window; the extra factor needs its own bound."
  explain: |
    Translate |x − a| < 1 into a bound on |x + a|.
  lessons: [calc1.u1.l7]

- id: delta-min-wrong
  short: "Take the minimum: δ must keep both promises at once."
  explain: |
    min(1, ε/bound) is never larger than either.
  lessons: [calc1.u1.l7]

- id: delta-max-one
  short: "Choosing δ ≤ 1 is a convenience for one proof, not a rule — and δ is always positive."
  explain: |
    Use the min of the two requirements.
  lessons: [calc1.u1.l7]

- id: delta-safe-is-largest
  short: "The recipe gives a safe δ, not necessarily the largest one."
  explain: |
    The largest is where the graph first leaves the band.
  lessons: [calc1.u1.l7]

- id: delta-wrong-side
  short: "The graph leaves the band first on its steeper side — that side sets the largest δ."
  explain: |
    Compute both gaps; take the smaller.
  lessons: [calc1.u1.l7]

- id: delta-independent
  short: "δ depends on ε: a tighter band needs a narrower window."
  explain: |
    For a line, δ = ε/|m| scales with ε.
  lessons: [calc1.u1.l7]

- id: quantifier-order
  short: "\"There is a δ for every ε\" is a different (much stronger) statement than \"for every ε there is a δ\"."
  explain: |
    In the limit definition, δ may depend on ε.
  lessons: [calc1.u1.l7]

- id: epsilon-delta-always-wins
  short: "Only the true limit can meet every ε; a wrong L fails for any ε smaller than its distance from the true limit."
  explain: |
    Choose ε below that distance.
  lessons: [calc1.u1.l7]

- id: epsilon-zero
  short: "ε must be positive; ε = 0 would demand f(x) = L exactly."
  explain: |
    Pick a small positive ε instead.
  lessons: [calc1.u1.l7]
