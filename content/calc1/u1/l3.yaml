challenge:
  id: calc1.u1.l3.ch
  type: graph-manipulator
  title: "Remove the blow-up"
  concept: limit-algebraic-techniques
  uses: [s3, s6]
  params:
    sets:
      - { c: 2, d: 10, m: 2 }
      - { c: 3, d: 6, m: 3 }
      - { c: 1, d: 4, m: 2 }
  variants:
    easier:
      difficulty: 2
      goal: |
        $f(x) = \dfrac{x^2 + kx - {{d}}}{x - {{c}}}$ blows up at $x = {{c}}$ for most $k$. Find the $k$ that turns the blow-up into a hole, so
        $\lim_{x \to {{c}}} f(x)$ exists.
      config:
        f: "(x^2 + k*x - d) / (x - c)"
        view: { x: ["c - 4", "c + 4"], y: [-15, 20] }
        controls:
          - { name: k, min: -6, max: 6, step: 0.5, initial: -6 }
      check: { expr: "abs(c^2 + k*c - d) < 1e-9" }
      feedback:
        - { if: "true", say: "The graph still shoots off at x = c. The numerator must be 0 at x = c too.", misconception: limit-exists-any-k }
      hints:
        nudge: "Watch the graph near x = {{c}} as you change k."
        buildsOn: "From Q6: a finite limit needs 0/0, not nonzero/0."
        partial: "Solve {{c^2}} + {{c}}k − {{d}} = 0."
      solution: { k: "(d - c^2)/c" }
      explanation: |
        With the numerator 0 at ${{c}}$, the factor $(x - {{c}})$ cancels and the blow-up becomes a single missing point.
    standard:
      difficulty: 3
      goal: |
        Same $f(x) = \dfrac{x^2 + kx - {{d}}}{x - {{c}}}$. Find the $k$ that makes the limit at ${{c}}$ exist, then move the dashed line $y = L$
        to the limit's value.
      config:
        f: "(x^2 + k*x - d) / (x - c)"
        view: { x: ["c - 4", "c + 4"], y: [-15, 20] }
        controls:
          - { name: k, min: -6, max: 6, step: 0.5, initial: -6 }
          - { name: L, min: -10, max: 15, step: 0.5, initial: 0 }
        overlays: { band: { y: "L", eps: 0, x: "c" } }
      check: { expr: "abs(c^2 + k*c - d) < 1e-9 and abs(L - (2*c + k)) < 1e-9" }
      feedback:
        - { if: "abs(c^2 + k*c - d) > 1e-9", say: "First remove the blow-up: the numerator must vanish at x = c.", misconception: limit-exists-any-k }
        - { if: "true", say: "The hole is in the right place; now line up L with the height of the hole.", misconception: cancel-then-forget-substitute }
      hints:
        nudge: "After k is right, factor and cancel."
        buildsOn: "From Q3: cancel (x − {{c}}), then substitute."
        partial: "x² + kx − {{d}} = (x − {{c}})(x + k + {{c}}), so the limit is {{2*c}} + k."
      solution: { k: "(d - c^2)/c", L: "2*c + (d - c^2)/c" }
      explanation: |
        Cancelling $(x - {{c}})$ leaves $x + k + {{c}}$, so the hole sits at height ${{c}} + k + {{c}}$ — the limit.
    harder:
      difficulty: 4
      goal: |
        $f(x) = \dfrac{\sqrt{x + k} - {{m}}}{x - {{c}}}$. Find $k$ so the limit at ${{c}}$ exists, and move $y = L$ to the limit — within 0.01.
      config:
        f: "(sqrt(x + k) - m) / (x - c)"
        view: { x: ["c - 1.5", "c + 3"], y: [-1, 1.5] }
        controls:
          - { name: k, min: 0, max: 10, step: 0.5, initial: 0 }
          - { name: L, min: -1, max: 1, step: 0.005, initial: 0.5 }
        overlays: { band: { y: "L", eps: 0, x: "c" } }
      check: { expr: "abs(sqrt(c + k) - m) < 1e-9 and abs(L - 1/(2*m)) < 0.01" }
      feedback:
        - { if: "abs(sqrt(c + k) - m) > 1e-9", say: "The numerator must be 0 at x = c: √(c + k) = m.", misconception: limit-exists-any-k }
        - { if: "abs(L - 1/m) < 0.01", say: "Close — but the conjugate gives √(x + k) + m, which is 2m at the limit.", misconception: conjugate-half }
        - { if: "true", say: "Now find the limit: multiply by the conjugate.", misconception: conjugate-same-sign }
      hints:
        nudge: "First make √({{c}} + k) = {{m}}."
        buildsOn: "From Q4: multiply by the conjugate."
        partial: "With k = {{m^2 - c}}, f(x) = 1/(√(x + k) + {{m}}) for x ≠ {{c}}."
      solution: { k: "m^2 - c", L: "1/(2*m)" }
      explanation: |
        $k = {{m^2 - c}}$ makes the numerator vanish at ${{c}}$. The conjugate turns $f$ into $\frac{1}{\sqrt{x + k} + {{m}}}$, whose limit is
        $\frac{1}{ {{2*m}} }$.

summary:
  keyTakeaways:
    - "Limit laws let you substitute for polynomials and quotients with non-zero denominators."
    - "0/0 is indeterminate — factor, rationalize or combine fractions, then substitute."
    - "Nonzero/0 means a blow-up: no finite limit."
    - "Cancelling (x − a) is legal because the limit never uses x = a."
  next: calc1.u1.l4
