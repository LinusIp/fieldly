# Misconceptions for Physics II. `short` is shown after a wrong first attempt;
# `explain` is shown in the summary and on the profile page.

- id: ohm-multiply
  name: "Multiplied V and R instead of dividing"
  short: "This is what you get by multiplying V and R."
  explain: |
    More resistance means *less* current, so $R$ must be in the denominator: $I = V/R$.
  lessons: [phys2.u3.l2]

- id: ohm-inverted
  name: "Divided R by V (the fraction upside down)"
  short: "The fraction is upside down — that's R ÷ V."
  explain: |
    Rearranging $V = IR$ for $I$ gives $I = V/R$, not $R/V$. A quick check: doubling the
    voltage should double the current, so $V$ belongs on top.
  lessons: [phys2.u3.l2]

- id: current-equals-voltage
  name: "Took the current to equal the voltage"
  short: "That copies the voltage — volts and amperes measure different things."
  explain: |
    Voltage is energy per unit charge (V = J/C); current is charge per second (A = C/s).
    They are linked by the resistance, $I = V/R$, and are only numerically equal when $R = 1\ \Omega$.
  lessons: [phys2.u3.l1, phys2.u3.l2]

- id: current-used-up
  name: "Thought a resistor uses up current"
  short: "Current isn't used up by a resistor — energy is."
  explain: |
    Charge is conserved: every coulomb entering a resistor leaves it. What the resistor
    takes is *energy*, which is why the voltage drops across it while the current stays the same.
  lessons: [phys2.u3.l1, phys2.u3.l2]

- id: battery-constant-current
  name: "Thought a battery supplies a fixed current"
  short: "A battery fixes the voltage, not the current."
  explain: |
    An ideal battery keeps the voltage across its terminals constant. How much current flows
    depends on what is connected: $I = V/R_{tot}$. Change the circuit and the current changes.
  lessons: [phys2.u3.l2, phys2.u3.l4]

- id: square-law
  name: "Treated current as a square law in voltage"
  short: "That treats the relationship as a square law — it is only first power here."
  explain: |
    With $V$ fixed, $I = V/R$ and $P = V^2/R$ both depend on $R$ to the *first* power, so
    doubling $R$ halves them; it doesn't quarter them. Squares appear only when the squared
    quantity itself changes (e.g. $P = I^2R$ when $I$ changes).
  lessons: [phys2.u3.l2]

- id: series-no-change
  name: "Thought a series resistor changes nothing"
  short: "Adding a resistor in series always changes the total resistance."
  explain: |
    Every resistor in a series chain adds its resistance: $R_{tot} = R_1 + R_2 + \dots$
    So adding one raises the total and lowers the current.
  lessons: [phys2.u3.l2, phys2.u3.l3]

- id: series-parallel-confusion
  name: "Mixed up the series and parallel rules"
  short: "That's the rule for the other arrangement — series and parallel are swapped."
  explain: |
    **Series** (one path): resistances add, $R_{tot} = R_1 + R_2$, and the same current flows
    through each. **Parallel** (side by side): each branch gets the full voltage and
    $1/R_{tot} = 1/R_1 + 1/R_2$, so the total is *smaller* than either resistor.
  lessons: [phys2.u3.l2, phys2.u3.l3]

- id: multiply-resistances
  name: "Multiplied series resistances instead of adding"
  short: "Resistances in series add; they don't multiply."
  explain: |
    The charge pushes through one resistor and then the next, so the oppositions add:
    $R_{tot} = R_1 + R_2$. Multiplying would even give the wrong unit (Ω²).
  lessons: [phys2.u3.l2, phys2.u3.l3]

- id: double-halving
  name: "Halved the current once per resistor"
  short: "The current halves once, not once per resistor."
  explain: |
    Two equal resistors in series double the total resistance, which halves the current —
    once. Halving it again for the second resistor counts the same change twice.
  lessons: [phys2.u3.l2]

- id: each-gets-full-voltage
  name: "Gave each series resistor the full battery voltage"
  short: "In series the battery's voltage is shared between the resistors."
  explain: |
    The voltage drops across series resistors add up to the battery voltage (the loop rule).
    Only components connected *in parallel* across the battery each get its full voltage.
  lessons: [phys2.u3.l2, phys2.u3.l3]

- id: current-voltage-confusion
  name: "Reported a current as a voltage"
  short: "That number is the current, in amperes — not a voltage."
  explain: |
    Keep track of units: $V/R$ is a current (A); $IR$ is a voltage (V). Writing the unit
    next to each step catches this mix-up.
  lessons: [phys2.u3.l2]

- id: power-divide
  short: "V ÷ I is the resistance (in Ω), not the power."
  explain: |
    Power is the rate of energy transfer, $P = VI$: volts (joules per coulomb) times amperes
    (coulombs per second) gives joules per second, i.e. watts.
  lessons: [phys2.u3.l2]

- id: power-add
  short: "Volts and amperes can't be added — power is their product."
  explain: |
    Quantities with different units can't be added. Power is $P = VI$, a product.
  lessons: [phys2.u3.l2]

- id: power-is-current
  name: "Gave the current as the power"
  short: "That's the current (in A), not the power."
  explain: |
    $V/R$ is the current. Power needs one more factor: $P = VI = V^2/R$.
  lessons: [phys2.u3.l2]

- id: power-formula-mixup
  name: "Used V × R for power instead of V²/R"
  short: "Power is V²/R, not V × R — more resistance gives less power at fixed V."
  explain: |
    The three equivalent forms are $P = VI = I^2R = V^2/R$. With the voltage fixed, a bigger
    resistance lets less current through, so the power goes *down*.
  lessons: [phys2.u3.l2]

- id: power-equals-voltage
  name: "Gave the voltage as the power"
  short: "That's the voltage, not the power."
  explain: |
    Power depends on both voltage and current: $P = VI$. The voltage alone is not a power.
  lessons: [phys2.u3.l2]

- id: power-proportional-R
  name: "Thought power rises with resistance at a fixed voltage"
  short: "With the voltage fixed, power goes *down* as resistance goes up."
  explain: |
    At fixed $V$, $P = V^2/R$, so power is inversely proportional to $R$. (It's only at fixed
    *current* that $P = I^2R$ grows with $R$.)
  lessons: [phys2.u3.l2]

- id: power-fixed-by-battery
  name: "Thought a battery delivers a fixed power"
  short: "A battery fixes the voltage; the power depends on what's connected."
  explain: |
    The power drawn from an ideal battery is $P = V^2/R_{tot}$. Change the circuit and the
    power changes, even though the battery's voltage stays the same.
  lessons: [phys2.u3.l2]

- id: more-resistors-more-power
  name: "Thought more series resistance means more power"
  short: "Extra series resistance lowers the total power, it doesn't raise it."
  explain: |
    In series, extra resistors raise $R_{tot}$, which lowers the current and the total power
    $P = V^2/R_{tot}$. (In parallel, extra branches *lower* $R_{tot}$ and raise the power.)
  lessons: [phys2.u3.l2]

- id: forgot-total-R
  name: "Kept the old resistance after the circuit changed"
  short: "You squared the smaller current but kept the old resistance."
  explain: |
    If you use $P = I^2R$, use the *new* current and the *new* total resistance together.
    Halving $I$ quarters $I^2$, but doubling $R_{tot}$ doubles it back: the net factor is ½.
  lessons: [phys2.u3.l2]

- id: short-means-no-current
  name: "Thought a short stops the whole circuit"
  short: "A short across one resistor doesn't stop the whole circuit."
  explain: |
    A wire across a component gives the current a zero-resistance path around it. That
    component goes dark, but the rest of the loop still carries current — usually *more* of it.
  lessons: [phys2.u3.l2, phys2.u3.l3]

- id: parallel-partial
  short: "That compares with the single resistor, not with the series pair."
  explain: |
    Check the baseline. Parallel pair: $2P$. Single resistor: $P$. Series pair: $P/2$.
    Parallel vs series is $2P \div \tfrac{P}{2} = 4$.
  lessons: [phys2.u3.l2]

- id: parallel-one-branch
  name: "Counted only one parallel branch"
  short: "That's the current in one branch only — the battery supplies both."
  explain: |
    In parallel, the current from the battery splits between the branches and recombines.
    The battery's current is the *sum* of the branch currents (the junction rule).
  lessons: [phys2.u3.l2, phys2.u3.l3]

- id: resistance-means-more-work
  name: "Thought more resistance means more power"
  short: "More resistance in the path means less current and less power, not more."
  explain: |
    It is tempting to think a resistor "uses" more energy when it resists more. But with a
    fixed voltage, more resistance chokes the current, and $P = V^2/R$ falls.
  lessons: [phys2.u3.l2]

- id: wrong-baseline
  name: "Compared against the wrong starting circuit"
  short: "That uses the parallel-vs-series factor, but the baseline here is the single resistor."
  explain: |
    Always check what you are comparing against. A ratio between two circuits only applies
    when the question compares those same two circuits.
  lessons: [phys2.u3.l2]

- id: current-takes-easiest-path
  name: "Thought current picks the easiest path in a single loop"
  short: "With only one path, the current can't choose — it goes through everything."
  explain: |
    "Current takes the easiest path" is only meaningful at a junction, and even there current
    splits between all paths in inverse proportion to their resistance; it does not all go one way.
  lessons: [phys2.u3.l2, phys2.u3.l3]

# ── phys2.u3.l1: current, charge conservation, resistivity ──
- id: charge-rate-multiply
  short: "Current is charge *per second* — divide by the time, don't multiply."
  explain: |
    $I = Q/t$. The same charge spread over a longer time is a *smaller* current, so time divides.
  lessons: [phys2.u3.l1]

- id: charge-rate-inverted
  short: "That's upside down — seconds per coulomb instead of coulombs per second."
  explain: |
    Current is coulombs per second: $I = Q/t$. Check the units of your answer: A = C/s.
  lessons: [phys2.u3.l1]

- id: charge-equals-current
  short: "That's the total charge, not the charge per second."
  explain: |
    Charge (C) is an amount; current (A = C/s) is a rate. You need to divide by the time.
  lessons: [phys2.u3.l1]

- id: electron-count-multiply
  short: "To count electrons, divide by the charge of one electron."
  explain: |
    If each electron carries $1.6 \times 10^{-19}$ C, the number of electrons in a charge $Q$ is
    $Q / (1.6 \times 10^{-19})$ — a huge number, not a tiny one.
  lessons: [phys2.u3.l1]

- id: current-converted-to-heat
  short: "A heater or lamp converts *energy* into heat and light, not charge."
  explain: |
    Every coulomb that enters a component leaves it. The charges lose energy (their potential
    drops), and that energy becomes heat or light.
  lessons: [phys2.u3.l1]

- id: heating-adds-charge
  short: "Nothing in the loop creates charge, so the current can't increase."
  explain: |
    Charge is conserved: in a single loop the same current flows through every part.
  lessons: [phys2.u3.l1]

- id: junction-full-current
  short: "At a junction the current is shared — each branch doesn't get all of it."
  explain: |
    Kirchhoff's junction rule: the currents leaving a junction add up to the current arriving.
  lessons: [phys2.u3.l1, phys2.u3.l5]

- id: branches-equal
  short: "Branch currents are only equal when the branches are identical."
  explain: |
    At a junction the current divides according to the branches' resistances. Use conservation:
    $I_{in} = I_1 + I_2$.
  lessons: [phys2.u3.l1, phys2.u3.l3]

- id: junction-adds
  short: "Adding would create charge at the junction — subtract instead."
  explain: |
    The branch currents add up *to* the incoming current: $I_2 = I_{in} - I_1$.
  lessons: [phys2.u3.l1, phys2.u3.l5]

- id: length-area-swap
  short: "Length and area are swapped: longer wires resist more, thicker wires less."
  explain: |
    $R = \rho L / A$ — length on top, cross-sectional area underneath.
  lessons: [phys2.u3.l1]

- id: area-raises-R
  short: "A bigger cross-section *lowers* the resistance."
  explain: |
    A thicker wire gives the charges more room to flow. $R = \rho L/A$, so $R \propto 1/A$.
  lessons: [phys2.u3.l1]

- id: resistivity-backwards
  short: "Higher resistivity means *more* resistance."
  explain: |
    Resistivity $\rho$ measures how strongly a material opposes current. $R = \rho L / A$.
  lessons: [phys2.u3.l1]

- id: mm2-conversion
  short: "The area must be in m² — 1 mm² = 10⁻⁶ m²."
  explain: |
    $R = \rho L/A$ needs SI units throughout. A millimetre is $10^{-3}$ m, so a square millimetre is
    $(10^{-3})^2 = 10^{-6}$ m².
  lessons: [phys2.u3.l1]

- id: area-conversion-factor
  short: "1 mm² is 10⁻⁶ m², not 10⁻³ m² — the length factor gets squared."
  explain: |
    Converting an area converts *two* lengths: $1 \text{ mm}^2 = (10^{-3} \text{ m})^2 = 10^{-6}$ m².
  lessons: [phys2.u3.l1]

- id: length-ignored
  short: "The length changed too — and R is proportional to length."
  explain: |
    $R = \rho L/A$: if $L$ changes, $R$ changes in proportion.
  lessons: [phys2.u3.l1]

- id: cut-halves-area
  short: "Cutting a wire shortens it; it doesn't make it thinner."
  explain: |
    Each piece keeps the original cross-section; only its length is halved, so its resistance is halved.
  lessons: [phys2.u3.l1]

- id: longer-lower-R
  short: "A longer wire has *more* resistance, not less."
  explain: |
    The charges have a longer obstacle course: $R \propto L$.
  lessons: [phys2.u3.l1]

- id: square-law-length
  short: "Resistance is proportional to length — to the first power, not squared."
  explain: |
    $R = \rho L/A$: doubling $L$ doubles $R$. (Stretching a wire is different: it also thins it.)
  lessons: [phys2.u3.l1]

- id: area-ignored
  short: "The cross-section changed too — a thicker wire has less resistance."
  explain: |
    $R = \rho L/A$: doubling the area halves the resistance.
  lessons: [phys2.u3.l1]

- id: stretch-area-unchanged
  short: "Stretching keeps the volume fixed, so the wire also gets thinner."
  explain: |
    Volume $= L A$. Doubling $L$ at fixed volume halves $A$, so $R = \rho L/A$ goes up by $2 \times 2 = 4$.
  lessons: [phys2.u3.l1]

- id: stretch-cancels
  short: "Longer *and* thinner both raise R — the effects multiply, they don't cancel."
  explain: |
    $L \to 2L$ doubles $R$; $A \to A/2$ doubles it again. Net factor: 4.
  lessons: [phys2.u3.l1]

- id: v-equals-i-over-r
  short: "Voltage is I × R, not I ÷ R."
  explain: |
    $R = V/I$ (volts per ampere), so $V = IR$. Pushing a current through more resistance takes *more* voltage.
  lessons: [phys2.u3.l1, phys2.u3.l2]

- id: v-equals-r-over-i
  short: "R ÷ I isn't a voltage — voltage is I × R."
  explain: |
    Check units: Ω/A is not V. Since $R = V/I$, $V = IR$.
  lessons: [phys2.u3.l1]

- id: voltage-equals-current
  short: "That copies the current — volts and amperes are different quantities."
  explain: |
    Voltage and current are linked through resistance: $V = IR$.
  lessons: [phys2.u3.l1]

- id: voltmeter-reads-total
  short: "The voltmeter only spans part of the wire, so it reads only that part's share."
  explain: |
    A voltmeter reads the potential difference between the two points it touches. Across half a
    uniform wire, that's half the total voltage.
  lessons: [phys2.u3.l1, phys2.u3.l6]

# ── phys2.u3.l3: series & parallel networks ──
- id: parallel-average
  short: "Parallel resistance isn't the average — it's smaller than the smallest branch."
  explain: |
    $1/R_p = 1/R_1 + 1/R_2$. Even two equal resistors give *half* of one, not their average.
  lessons: [phys2.u3.l3]

- id: parallel-forgot-reciprocal
  short: "That's 1/R_p — take the reciprocal to get R_p."
  explain: |
    Adding $1/R_1 + 1/R_2$ gives the equivalent *conductance*. Flip it to get the resistance.
  lessons: [phys2.u3.l3]

- id: parallel-subtract
  short: "In parallel, the reciprocals combine — the resistances themselves don't subtract."
  explain: |
    To find a missing branch: $1/R_3 = 1/R_p - 1/R_2$, then take the reciprocal.
  lessons: [phys2.u3.l3]

- id: series-as-parallel
  short: "These two are in series (one path), so their resistances add."
  explain: |
    Series means the same current passes through both one after the other: $R = R_1 + R_2$.
  lessons: [phys2.u3.l3]

- id: series-resistor-ignored
  short: "A resistor in series still adds its resistance — don't leave it out."
  explain: |
    Collapse the network step by step and keep every part: the parallel pair's equivalent *plus* the series resistor.
  lessons: [phys2.u3.l3]

- id: network-all-series
  short: "Not everything is in series — two of these resistors sit side by side."
  explain: |
    Resistors are in series only if the same current must pass through both with no junction between.
    Resistors connected between the same two points are in parallel.
  lessons: [phys2.u3.l3]

- id: parallel-removal-lowers-R
  short: "Removing a parallel branch takes away a route, so the resistance goes *up*."
  explain: |
    Every extra parallel branch lowers the total resistance; removing one raises it.
  lessons: [phys2.u3.l3]

- id: parallel-branch-dominates
  short: "An extra parallel branch helps, but the series resistor still sets most of the total."
  explain: |
    Work the totals out: a parallel group can never drop below zero, so a large series resistor limits how low the total can go.
  lessons: [phys2.u3.l3]

- id: changes-equal-effect
  short: "Different changes have different effects — compute each total."
  explain: |
    Compare the totals numerically rather than guessing; series and parallel changes act very differently.
  lessons: [phys2.u3.l3]

- id: series-current-splits
  short: "Current only splits at a junction; a series resistor carries all of it."
  explain: |
    In a single path there's nowhere else for the charge to go, so the same current flows through every series part.
  lessons: [phys2.u3.l3]

- id: wrong-resistor-drop
  short: "That's the voltage across the *other* part of the circuit."
  explain: |
    In series the drops add up to the battery voltage. Check which part the question asks about.
  lessons: [phys2.u3.l3]

- id: voltage-splits-equally
  short: "Series resistors share the voltage in proportion to resistance, not 50/50."
  explain: |
    The same current flows through each, so $V_k = I R_k$: a bigger resistance takes a bigger share.
  lessons: [phys2.u3.l3]

- id: voltage-splits-in-parallel
  short: "Parallel branches don't split the voltage — each gets all of it."
  explain: |
    Branches connected between the same two points have the same voltage. It's the *current* that splits.
  lessons: [phys2.u3.l3]

- id: series-current-through-parallel
  short: "The full current doesn't go through one branch — it splits at the junction."
  explain: |
    Only part of the current flows through each parallel branch. Use the branch's voltage: $I_k = V_p/R_k$.
  lessons: [phys2.u3.l3]

- id: wrong-branch
  short: "That's the current in the other branch."
  explain: |
    Each branch has the same voltage but its own resistance, so each has its own current $V_p/R_k$.
  lessons: [phys2.u3.l3]

- id: current-divider-swap
  short: "Current divides *inversely* — the bigger resistance carries the smaller current."
  explain: |
    Each branch has the same voltage, so $I_k = V/R_k$. Twice the resistance means half the current.
  lessons: [phys2.u3.l3]

- id: parallel-independent
  short: "The branch didn't change, but the voltage across it did."
  explain: |
    Parallel branches are independent only when they sit directly across an ideal battery. With a
    resistor in series, removing a branch changes the pair's voltage.
  lessons: [phys2.u3.l3]

- id: open-branch-kills-all
  short: "Only the broken branch stops — the other branch still completes the loop."
  explain: |
    A break in one parallel branch removes that route only. Current still flows through the others.
  lessons: [phys2.u3.l3]

- id: total-current-only
  short: "The *total* current falls, but this branch's share rises."
  explain: |
    Follow both effects: the battery current changes, and so does how it is shared between branches.
  lessons: [phys2.u3.l3]

- id: parallel-smaller-only
  short: "The larger branch still carries some current, so the total is below even the smaller resistor."
  explain: |
    $1/R_p = 1/R_1 + 1/R_2$ is bigger than $1/R_1$ alone, so $R_p < R_1$.
  lessons: [phys2.u3.l3]

- id: voltage-share-inverse
  short: "In series, the *larger* resistance takes the larger voltage."
  explain: |
    Same current through both, so $V = IR$: voltage share is proportional to resistance.
    (In parallel it's the current that divides inversely.)
  lessons: [phys2.u3.l3]

# ── phys2.u3.l4: EMF & internal resistance ──
- id: internal-r-ignored
  short: "That treats the battery as ideal — its internal resistance is in series too."
  explain: |
    A real battery behaves like an ideal EMF in series with $r$: $I = \varepsilon/(R + r)$, and the
    load sees only $\varepsilon - Ir$.
  lessons: [phys2.u3.l4]

- id: load-ignored
  short: "That's the short-circuit current — the load is in the circuit too."
  explain: |
    $\varepsilon/r$ is the current with a wire across the terminals. With a load, $I = \varepsilon/(R + r)$.
  lessons: [phys2.u3.l4]

- id: emf-minus-r
  short: "You can't subtract ohms from volts — add r to the load's resistance."
  explain: |
    The internal resistance is a resistance in series with the load: $I = \varepsilon/(R + r)$.
  lessons: [phys2.u3.l4]

- id: internal-r-subtract
  short: "Internal resistance adds to the load, it doesn't subtract."
  explain: |
    The current passes through $r$ and $R$ one after the other, so they add: $R + r$.
  lessons: [phys2.u3.l4]

- id: total-as-internal
  short: "ε/I is the *total* resistance — subtract the load to get r."
  explain: |
    $\varepsilon / I = R + r$, so $r = \varepsilon/I - R$.
  lessons: [phys2.u3.l4]

- id: internal-r-sign
  short: "Subtract the load from the total, don't add it."
  explain: |
    $R + r = \varepsilon/I$, so $r = \varepsilon/I - R$.
  lessons: [phys2.u3.l4]

- id: r-formula-inverted
  short: "That ratio has no units of resistance — check the algebra."
  explain: |
    Start from $\varepsilon = I(R + r)$ and solve for $r$: $r = \varepsilon/I - R$.
  lessons: [phys2.u3.l4]

- id: lost-volts-as-terminal
  short: "Ir is the voltage lost *inside* the battery, not what reaches the terminals."
  explain: |
    $V_{terminal} = \varepsilon - Ir$. The lost volts $Ir$ are subtracted from the EMF.
  lessons: [phys2.u3.l4]

- id: terminal-equals-emf
  short: "The terminals show the full EMF only when no current flows."
  explain: |
    While current flows, $Ir$ is lost inside the battery: $V_{terminal} = \varepsilon - Ir < \varepsilon$.
  lessons: [phys2.u3.l4]

- id: lost-volts-added
  short: "The lost volts are subtracted from the EMF, not added."
  explain: |
    A battery supplying current can't show more than its EMF: $V = \varepsilon - Ir$.
  lessons: [phys2.u3.l4]

- id: terminal-for-drop
  short: "That's the new reading — the question asks how much it *drops*."
  explain: |
    The drop from $\varepsilon$ to $\varepsilon - Ir$ is $Ir$, the lost volts.
  lessons: [phys2.u3.l4]

- id: ideal-battery-assumption
  short: "A real battery has internal resistance, so it always loses some voltage and power."
  explain: |
    Only an ideal battery ($r = 0$) keeps its full EMF under load and wastes nothing.
  lessons: [phys2.u3.l4]

- id: drop-equals-emf
  short: "The reading sags by Ir — it doesn't collapse to zero."
  explain: |
    Under load the terminal voltage is $\varepsilon - Ir$, which is zero only for a short circuit.
  lessons: [phys2.u3.l4]

- id: emf-power-as-load
  short: "εI is everything the EMF produces — part of it heats the battery."
  explain: |
    $\varepsilon I = I^2 R + I^2 r$: the load gets $I^2 R$; the battery wastes $I^2 r$.
  lessons: [phys2.u3.l4]

- id: internal-power-as-load
  short: "I²r is the power heating the battery, not the load's."
  explain: |
    Use the load's own resistance (or voltage) to find its power: $I^2 R$.
  lessons: [phys2.u3.l4]

- id: efficiency-inverted
  short: "That's the share wasted inside the battery."
  explain: |
    Efficiency is the useful share: $R/(R + r)$. The rest, $r/(R + r)$, heats the battery.
  lessons: [phys2.u3.l4]

- id: max-power-means-max-efficiency
  short: "50 % is the efficiency at the matched load, not in general."
  explain: |
    Efficiency is $R/(R + r)$, which is 50 % only when $R = r$. Larger loads are more efficient.
  lessons: [phys2.u3.l4]

- id: max-current-max-power
  short: "More current, yes — but more of the power is wasted inside the battery."
  explain: |
    As $R \to 0$ the current is largest but almost no voltage reaches the load, so its power falls.
  lessons: [phys2.u3.l4]

- id: max-voltage-max-power
  short: "More voltage, yes — but too little current."
  explain: |
    As $R \to \infty$ the load gets nearly the full EMF but almost no current, so its power falls.
  lessons: [phys2.u3.l4]

- id: short-circuit-power
  short: "ε²/r is the power with a short circuit — and all of it heats the battery."
  explain: |
    With a load, $P = \varepsilon^2 R/(R + r)^2$, which peaks at $\varepsilon^2/4r$ when $R = r$.
  lessons: [phys2.u3.l4]

- id: matching-wrong-resistor
  short: "The maximum depends on the battery's internal resistance, not the old load."
  explain: |
    $P_{max} = \varepsilon^2/4r$ uses the internal resistance $r$.
  lessons: [phys2.u3.l4]

- id: matching-misapplied
  short: "Matching picks the best *load* for a given battery — not the best battery for a given load."
  explain: |
    With the load fixed, $P = \varepsilon^2 R/(R + r)^2$ increases as $r$ decreases. The smaller $r$, the better.
  lessons: [phys2.u3.l4]

- id: waste-half-of-load
  short: "At the matched load the battery wastes as much as the load gets, not half."
  explain: |
    Same current, equal resistances ($R = r$), so equal power $I^2R = I^2r$.
  lessons: [phys2.u3.l4]

- id: total-as-waste
  short: "That's the total from the EMF — the battery wastes half of it."
  explain: |
    At $R = r$ the EMF produces $\varepsilon^2/2r$; half reaches the load and half heats the battery.
  lessons: [phys2.u3.l4]

- id: max-power-quarter
  short: "The quarter is in ε²/4r, but efficiency compares load power with total power."
  explain: |
    Efficiency $= R/(R + r)$; with $R = r$ that's ½.
  lessons: [phys2.u3.l4]

- id: efficiency-unchanged
  short: "Efficiency depends on the load: R/(R + r)."
  explain: |
    Changing the load changes how the power divides between the load and the battery.
  lessons: [phys2.u3.l4]

# ── phys2.u3.l5: Kirchhoff's rules ──
- id: junction-subtract-wrong
  short: "Both currents flow *into* the junction, so they add."
  explain: |
    Junction rule: total in = total out. Subtract only when one current flows in and the other out.
  lessons: [phys2.u3.l5]

- id: junction-ignores-branch
  short: "Every wire at the junction counts — don't drop one of the currents."
  explain: |
    Charge arriving through any wire must leave somewhere. Include all of them in the junction equation.
  lessons: [phys2.u3.l5]

- id: junction-average
  short: "Currents meeting at a junction add; they don't average."
  explain: |
    The outgoing current carries all the charge from both incoming wires: $I_3 = I_1 + I_2$.
  lessons: [phys2.u3.l5]

- id: series-current-everywhere
  short: "Equal currents everywhere is true for a single loop, not at a junction."
  explain: |
    At a junction the current divides or combines, so the branch currents differ. In = out still holds.
  lessons: [phys2.u3.l5]

- id: junction-sign-all-in
  short: "A 'sum = 0' form only works if currents leaving count as negative."
  explain: |
    With arrows drawn two in and one out, write in = out: $I_1 + I_2 = I_3$.
  lessons: [phys2.u3.l5]

- id: junction-sign-error
  short: "Then more would leave than arrive — charge would be created."
  explain: |
    Balance the junction: what flows in must equal what flows out, including the direction of each current.
  lessons: [phys2.u3.l5]

- id: loop-sums-to-emf
  short: "The EMF is one of the rises; the *total* change round a loop is zero."
  explain: |
    Potential has one value at each point. Back at the start, the rises and drops have cancelled.
  lessons: [phys2.u3.l5]

- id: loop-path-dependent
  short: "Going the other way flips every sign — the total is still zero."
  explain: |
    The loop rule holds in either direction because potential is single-valued.
  lessons: [phys2.u3.l5]

- id: loop-current-confusion
  short: "That mixes the loop rule with Ohm's law for a single resistor."
  explain: |
    The loop rule sums each component's own rise or drop: $\sum \varepsilon = \sum I_k R_k$.
  lessons: [phys2.u3.l5]

- id: loop-misses-shared
  short: "The shared resistor is part of this loop too — it takes some of the EMF."
  explain: |
    List every component the loop passes through. A resistor shared between two loops appears in both loop equations.
  lessons: [phys2.u3.l5]

- id: loop-wrong-path
  short: "That resistor isn't on this loop."
  explain: |
    Trace the loop's path carefully; include only the components it passes through.
  lessons: [phys2.u3.l5]

- id: loop-extra-emf
  short: "That battery isn't on this loop."
  explain: |
    Only EMFs the loop actually passes through appear in its equation.
  lessons: [phys2.u3.l5]

- id: loop-sign-ignored
  short: "Watch the signs: drops are subtracted from rises, and opposing batteries subtract."
  explain: |
    Through a resistor *with* the current: drop $IR$. Against it: rise $IR$. Battery − to +: rise; + to −: drop.
  lessons: [phys2.u3.l5]

- id: loop-current-sign
  short: "Crossing a resistor against its current arrow is a *rise* of IR."
  explain: |
    Potential falls in the direction of conventional current through a resistor, so going the other way it rises.
  lessons: [phys2.u3.l5]

- id: loop-missing-emf
  short: "Every EMF on the loop counts, including the second battery."
  explain: |
    The outer loop passes through both batteries; both appear in its equation.
  lessons: [phys2.u3.l5]

- id: current-uphill
  short: "Through a resistor, current flows from higher to lower potential."
  explain: |
    Conventional current runs "downhill" in potential through resistors; only inside a source is it pushed uphill.
  lessons: [phys2.u3.l5]

- id: shared-resistor-ignored
  short: "The shared resistor dissipates power too — often the most."
  explain: |
    Every resistor with current through it dissipates $I^2R$. Include them all.
  lessons: [phys2.u3.l5]

- id: total-current-everywhere
  short: "Each part carries its own current — not the junction total."
  explain: |
    Use the current through each component itself when computing its power or voltage.
  lessons: [phys2.u3.l5]

- id: second-source-ignored
  short: "The second battery also pushes current out of its + terminal, so it supplies power too."
  explain: |
    Total power supplied is $\sum \varepsilon I$ over every source delivering current.
  lessons: [phys2.u3.l5]

- id: source-power-subtract
  short: "Both batteries are discharging here, so both powers add."
  explain: |
    A battery supplies power $\varepsilon I$ when current leaves its + terminal. It only absorbs power
    (is charged) when current is forced into its + terminal.
  lessons: [phys2.u3.l5]

- id: junction-potential-fixed
  short: "A's potential depends on both batteries — change one and it moves."
  explain: |
    Node potentials come from solving the whole circuit; altering any EMF changes them.
  lessons: [phys2.u3.l5]

# ── phys2.u3.l6: meters in circuits ──
- id: ammeter-in-parallel
  short: "An ammeter must be *in* the path (series) — across a part it acts like a wire and shorts it."
  explain: |
    An ammeter measures the current flowing through it, and has almost no resistance. In series it
    counts the current; in parallel it bypasses the component.
  lessons: [phys2.u3.l6]

- id: ammeter-across-source
  short: "A near-zero-resistance meter across the battery is a short circuit."
  explain: |
    Ammeters go in series with the part whose current you want, never directly across a source.
  lessons: [phys2.u3.l6]

- id: meter-placement-irrelevant
  short: "How a meter is connected decides what it measures."
  explain: |
    In series a meter sees the current through the path; across two points it sees the voltage
    between them. Ammeters belong in series; voltmeters across.
  lessons: [phys2.u3.l6]

- id: voltmeter-in-series
  short: "A voltmeter goes *across* the part (in parallel); in series it nearly blocks the current."
  explain: |
    A voltmeter has a very high resistance. In series it takes almost all the voltage and the
    current almost stops. Across a component it reads that component's voltage and changes little.
  lessons: [phys2.u3.l6]

- id: voltmeter-across-source
  short: "Across the battery, the voltmeter reads the battery's voltage, not the resistor's."
  explain: |
    A voltmeter reads the potential difference between the two points its leads touch. Put the
    leads on the ends of the part you want.
  lessons: [phys2.u3.l6]

- id: meters-swapped
  short: "The meters are swapped: ammeters in series, voltmeters in parallel."
  explain: |
    Current flows *through* things (series); voltage is *across* things (parallel).
  lessons: [phys2.u3.l6]

- id: meter-reads-zero-open
  short: "With almost no current, the resistors drop almost nothing — so the voltmeter gets nearly all of it."
  explain: |
    In series, voltage divides in proportion to resistance. A voltmeter's enormous resistance takes
    almost the whole battery voltage.
  lessons: [phys2.u3.l6]

- id: voltmeter-reads-current
  short: "A voltmeter only ever reads volts."
  explain: |
    Whatever its connection, a voltmeter shows the potential difference between its leads.
  lessons: [phys2.u3.l6]

- id: meter-loading-ignored
  short: "A real meter has resistance, so it changes the circuit a little."
  explain: |
    A voltmeter with resistance $R_V$ across $R$ makes $R \parallel R_V < R$; an ammeter with
    resistance $R_A$ adds to the series path. Both shift the readings.
  lessons: [phys2.u3.l6]

- id: ammeter-resistance-subtract
  short: "A meter's resistance in series adds to the total."
  explain: |
    Series resistances add, so a real ammeter slightly lowers the current it measures.
  lessons: [phys2.u3.l6]

- id: ammeter-only-resistance
  short: "The meter isn't the only resistance in the loop."
  explain: |
    The total is the circuit's resistance *plus* the meter's: $I = V/(R_{tot} + R_A)$.
  lessons: [phys2.u3.l6]

- id: loading-raises-reading
  short: "Loading makes a voltmeter read *low*, never high."
  explain: |
    $R \parallel R_V$ is smaller than $R$, so the part takes a smaller share of the voltage.
  lessons: [phys2.u3.l6]

- id: error-wrong-base
  short: "Percentage error is measured against the true value."
  explain: |
    Error $= (\text{true} - \text{measured})/\text{true} \times 100\%$.
  lessons: [phys2.u3.l6]

- id: loading-ratio-guess
  short: "The error depends on the whole circuit — work it out."
  explain: |
    Recompute the circuit with $R \parallel R_V$ in place of $R$, then compare the readings.
  lessons: [phys2.u3.l6]

- id: loading-unchanged
  short: "A different meter resistance gives a different loading, so a different reading."
  explain: |
    The reading depends on $R \parallel R_V$, which changes whenever $R_V$ does.
  lessons: [phys2.u3.l6]

- id: loading-scales
  short: "A better meter can't read more than the true voltage — let alone ten times it."
  explain: |
    As $R_V$ grows, the reading rises *toward* the true value and stops there.
  lessons: [phys2.u3.l6]

- id: low-resistance-voltmeter
  short: "Less resistance draws *more* current and loads the circuit more."
  explain: |
    The ideal voltmeter has infinite resistance; the higher $R_V$, the smaller the error.
  lessons: [phys2.u3.l6]

- id: high-resistance-blocks
  short: "A huge resistance in *parallel* doesn't block anything — it just draws almost no current."
  explain: |
    Across a component, a very high-resistance meter barely changes the circuit and reads the true voltage.
  lessons: [phys2.u3.l6]

# ── phys2.u3.l7: capacitors ──
- id: q-c-divide
  short: "Q = CV — the charge grows with the voltage, so multiply."
  explain: |
    Capacitance is charge per volt, $C = Q/V$, so $Q = CV$.
  lessons: [phys2.u3.l7]

- id: q-inverted
  short: "That's upside down — Q = CV."
  explain: |
    Check the units: μF × V = μC.
  lessons: [phys2.u3.l7]

- id: charge-energy-confusion
  short: "½CV² is the stored *energy*; the charge is Q = CV."
  explain: |
    $Q = CV$ (coulombs) and $U = \tfrac12 CV^2$ (joules) measure different things.
  lessons: [phys2.u3.l7]

- id: charge-unchanged-connected
  short: "With the battery connected, V stays fixed — so the charge follows C."
  explain: |
    Connected: $V$ is fixed and $Q = CV$ changes with $C$. Disconnected: $Q$ is fixed and $V = Q/C$ changes.
  lessons: [phys2.u3.l7]

- id: separation-raises-C
  short: "A wider gap *lowers* the capacitance: C = ε₀A/d."
  explain: |
    Moving the plates apart weakens their influence on each other, so less charge is stored per volt.
  lessons: [phys2.u3.l7]

- id: capacitor-series-parallel-swap
  short: "Capacitor rules are the reverse of resistors': parallel adds, series uses reciprocals."
  explain: |
    Parallel: $C = C_1 + C_2$ (same voltage, charges add). Series: $1/C = 1/C_1 + 1/C_2$ (same charge, voltages add).
  lessons: [phys2.u3.l7]

- id: capacitor-average
  short: "Capacitances don't average — they add in parallel, and combine as reciprocals in series."
  explain: |
    Parallel gives more than either; series gives less than either.
  lessons: [phys2.u3.l7]

- id: multiply-capacitances
  short: "Multiplying gives μF², not a capacitance."
  explain: |
    In parallel, capacitances simply add: $C_1 + C_2$.
  lessons: [phys2.u3.l7]

- id: total-as-component
  short: "That's the total — subtract the known capacitor to find the unknown."
  explain: |
    In parallel, $C_{total} = C_1 + C_2$, so $C_2 = C_{total} - C_1$.
  lessons: [phys2.u3.l7]

- id: units-mixed
  short: "Charges (μC) and capacitances (μF) can't be subtracted from each other."
  explain: |
    Convert to the same quantity first: find the total capacitance $Q/V$, then subtract.
  lessons: [phys2.u3.l7]

- id: capacitor-forgot-reciprocal
  short: "That's 1/C — take the reciprocal."
  explain: |
    Adding $1/C_1 + 1/C_2$ gives $1/C$ for capacitors in series.
  lessons: [phys2.u3.l7]

- id: added-capacitor-ignored
  short: "Every capacitor in the combination counts."
  explain: |
    Include all of them: each added parallel capacitor raises $C$; each added series capacitor lowers it.
  lessons: [phys2.u3.l7]

- id: series-charge-splits
  short: "In series, each capacitor holds the *whole* charge, not a share."
  explain: |
    The charge leaving one plate of $C_1$ lands on a plate of $C_2$, so both hold the same $Q = C_s V$.
  lessons: [phys2.u3.l7]

- id: series-charge-full-C
  short: "In series, each capacitor gets only part of the battery's voltage."
  explain: |
    Use the combined capacitance: $Q = C_s V$, the same on each capacitor.
  lessons: [phys2.u3.l7]

- id: series-voltage-swap
  short: "In series, the *smaller* capacitor takes the larger voltage."
  explain: |
    Same charge on each, so $V_k = Q/C_k$: less capacitance means more voltage.
  lessons: [phys2.u3.l7]

- id: energy-missing-half
  short: "Stored energy is ½CV² — don't forget the half."
  explain: |
    The voltage rises from 0 to $V$ while charge is added, so the average voltage is $V/2$: $U = \tfrac12 QV$.
  lessons: [phys2.u3.l7]

- id: energy-not-squared
  short: "Energy goes as V², not V."
  explain: |
    $U = \tfrac12 CV^2$: double the voltage and the stored energy quadruples.
  lessons: [phys2.u3.l7]

- id: energy-unchanged-isolated
  short: "Pulling the plates apart takes work, and that work is stored."
  explain: |
    Isolated, $Q$ is fixed and $U = Q^2/2C$. Halving $C$ doubles $U$ — the extra comes from the work done separating the plates.
  lessons: [phys2.u3.l7]

- id: energy-fixed-by-battery
  short: "The battery fixes the voltage, not the energy stored."
  explain: |
    At a fixed voltage, $U = \tfrac12 CV^2$ grows with the capacitance.
  lessons: [phys2.u3.l7]

- id: capacitor-passes-dc
  short: "A capacitor blocks steady DC — current flows only while it charges."
  explain: |
    The plates are separated by an insulator. Once the capacitor's voltage matches the battery's, the current stops.
  lessons: [phys2.u3.l7, phys2.u3.l8]

- id: charging-current-increases
  short: "The charging current is largest at the start and falls to zero."
  explain: |
    As charge builds up, the capacitor's voltage opposes the battery's, so less and less current flows.
  lessons: [phys2.u3.l7, phys2.u3.l8]

- id: capacitor-as-wire
  short: "An uncharged capacitor acts like a wire only for an instant."
  explain: |
    At first there's no voltage across it, so current flows freely; as it charges, the current falls to zero.
  lessons: [phys2.u3.l7, phys2.u3.l8]

# ── phys2.u3.l8: RC circuits ──
- id: capacitor-blocks-initially
  short: "An *uncharged* capacitor lets current flow freely at first — it only blocks once charged."
  explain: |
    With no charge, $V_C = 0$, so at the instant of switching the capacitor behaves like a wire:
    $I_0 = V/R$. The current then falls as the capacitor charges.
  lessons: [phys2.u3.l8]

- id: capacitor-instant-charge
  short: "Charging takes time — the voltage builds up as charge arrives."
  explain: |
    $V_C = Q/C$ and charge arrives at a finite rate through the resistor, so $V_C$ starts at 0 and rises
    over a few time constants.
  lessons: [phys2.u3.l8]

- id: capacitor-instant-charge-back
  short: "A capacitor only pushes back once it holds charge."
  explain: |
    At first $V_C = 0$; its opposing voltage grows as it charges.
  lessons: [phys2.u3.l8]

- id: initial-charge-ignored
  short: "The capacitor already has some voltage, which opposes the battery."
  explain: |
    Loop rule: $V_R = V - V_C$. Existing charge on the capacitor reduces the initial current.
  lessons: [phys2.u3.l8]

- id: tau-ratio
  short: "τ = RC is a product — more R *or* more C slows the charging."
  explain: |
    Bigger $R$ means less current; bigger $C$ means more charge to deliver. Both lengthen $\tau$.
  lessons: [phys2.u3.l8]

- id: tau-ratio-inverted
  short: "Then more resistance would speed charging up — τ = RC."
  explain: |
    The time constant grows with both $R$ and $C$.
  lessons: [phys2.u3.l8]

- id: tau-full-charge
  short: "τ is not the time to charge fully — after one τ it's only at 63%."
  explain: |
    $V_C(\tau) = 0.632\,V$. It takes about $5\tau$ to reach 99%, and strictly it never quite finishes.
  lessons: [phys2.u3.l7, phys2.u3.l8]

- id: rc-unit-prefix
  short: "Check the prefixes: kΩ × μF = ms, not s."
  explain: |
    $10^3 \times 10^{-6} = 10^{-3}$, so kilo-ohms times microfarads gives milliseconds.
  lessons: [phys2.u3.l8]

- id: tau-depends-on-v
  short: "The battery voltage isn't in τ = RC."
  explain: |
    A bigger $V$ charges the capacitor to a higher voltage, but the *pace* (the time constant) depends only on $R$ and $C$.
  lessons: [phys2.u3.l8]

- id: tau-half
  short: "50% comes at τ ln 2 ≈ 0.69τ; after one τ it's 63%."
  explain: |
    Solve $1 - e^{-t/\tau} = \tfrac12$: $t = \tau \ln 2$.
  lessons: [phys2.u3.l8]

- id: charge-decay-confusion
  short: "Charging rises to 63%; decaying quantities (the current, a discharge) fall to 37%."
  explain: |
    $V_C = V(1 - e^{-t/\tau})$ when charging; $I = I_0 e^{-t/\tau}$ and $V_C = V_0 e^{-t/\tau}$ when decaying.
  lessons: [phys2.u3.l8]

- id: linear-charging
  short: "The curve isn't a straight line — it slows down as it goes."
  explain: |
    Each time constant closes 63% of the *remaining* gap, so progress gets slower and slower.
  lessons: [phys2.u3.l8]

- id: tau-only
  short: "That's after one time constant; the question asks about a later time."
  explain: |
    Count time constants: $t/\tau$. Then use $1 - e^{-t/\tau}$ (charging) or $e^{-t/\tau}$ (decay).
  lessons: [phys2.u3.l8]

- id: log-base
  short: "Exponentials in e need the natural log, ln."
  explain: |
    $e^{-t/\tau} = \tfrac12$ gives $t = \tau \ln 2 = 0.693\tau$; $\log_{10} 2 = 0.301$ is the wrong base.
  lessons: [phys2.u3.l8]

- id: tau-63-misapplied
  short: "63% is the voltage at t = τ — it doesn't scale the time."
  explain: |
    To reach 63% at $T$, simply set $\tau = T$.
  lessons: [phys2.u3.l8]

- id: log-inverted
  short: "τ = T / ln 2, not T × ln 2."
  explain: |
    From $T = \tau \ln 2$, divide: $\tau = T/\ln 2$.
  lessons: [phys2.u3.l8]

# ── phys2.u3.l2: Ohm's law and electrical power (reference lesson) ──
- id: parallel-gets-more
  name: "Gave a parallel branch the full current"
  short: "Each parallel branch carries only part of the current that feeds it."
  explain: |
    The current splits at the junction; a resistor carrying all of it dissipates more (P = I²R).
  lessons: [phys2.u3.l2]

- id: ohm-rearrange
  name: "Rearranged V = IR wrongly"
  short: "Rearrange V = IR carefully: V is already on its own."
  explain: |
    V = IR; I = V/R; R = V/I.
  lessons: [phys2.u3.l2]

- id: computed-power-instead
  name: "Computed the power instead of the resistance"
  short: "V × I is the power in watts, not the resistance."
  explain: |
    Resistance is R = V/I.
  lessons: [phys2.u3.l2]

- id: largest-only
  name: "Counted only the largest series resistor"
  short: "In series every resistor adds to the total, not just the largest."
  explain: |
    R_tot = R₁ + R₂ + R₃.
  lessons: [phys2.u3.l2]

- id: average-resistance
  name: "Averaged parallel resistances"
  short: "Parallel resistance is not the average — it is smaller than the smallest resistor."
  explain: |
    1/R = 1/R₁ + 1/R₂, or product over sum for two.
  lessons: [phys2.u3.l2]

- id: power-rearrange
  name: "Rearranged P = VI as V/P"
  short: "From P = VI, the current is I = P/V — not V/P."
  explain: |
    Check the units: watts ÷ volts = amperes.
  lessons: [phys2.u3.l2]

- id: divider-swapped
  name: "Used the other resistor of the divider"
  short: "That is the voltage across the other resistor."
  explain: |
    In series, each resistor gets V × (its R) / R_tot — the bigger resistor gets the bigger share.
  lessons: [phys2.u3.l2]

- id: equal-split
  name: "Split the voltage equally between unequal parts"
  short: "The split is equal only when the parts are identical."
  explain: |
    Series voltages and parallel currents divide in proportion to resistance (or its inverse).
  lessons: [phys2.u3.l2]

- id: parallel-dimmer
  name: "Thought parallel bulbs are dimmer"
  short: "Bulbs in parallel each get the full battery voltage, so each is as bright as a single bulb."
  explain: |
    It is series bulbs that share the voltage and glow dimmer.
  lessons: [phys2.u3.l2]
