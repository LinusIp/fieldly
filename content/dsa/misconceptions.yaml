# Misconceptions for Data Structures & Algorithms.

# ── dsa.u1.l1: algorithm analysis ──
- id: pairs-ordered
  short: "That counts each pair twice (i, j and j, i) — or compares items with themselves."
  explain: |
    Among $n$ items there are $n(n-1)/2$ unordered pairs. $n^2$ counts ordered pairs *and* the $n$
    self-pairs.
  lessons: [dsa.u1.l1, dsa.u1.l2]

- id: linear-guess
  short: "One pass can't compare every pair — nested loops do much more work."
  explain: |
    Comparing every pair needs about $n^2/2$ comparisons, not $n$.
  lessons: [dsa.u1.l1]

- id: pairs-include-self
  short: "That includes comparing each item with itself."
  explain: |
    If the inner loop starts after the outer index, an item is never compared with itself:
    $(n-1) + (n-2) + \dots + 0 = n(n-1)/2$.
  lessons: [dsa.u1.l1, dsa.u1.l2]

- id: lower-order-dominates
  short: "For large n the highest power wins; lower-order terms don't matter."
  explain: |
    At $n = 1000$, $n^2 = 10^6$ while $n = 10^3$. Big-O keeps only the dominant term.
  lessons: [dsa.u1.l1]

- id: big-o-keeps-terms
  short: "Big-O keeps only the fastest-growing term."
  explain: |
    $O(n^2 + n)$ is just $O(n^2)$: the $n$ term becomes irrelevant for large $n$.
  lessons: [dsa.u1.l1]

- id: big-o-keeps-constants
  short: "Constant factors are dropped: O(n²/2) is the same class as O(n²)."
  explain: |
    Big-O describes growth up to a constant factor, because constants depend on the machine and
    the implementation. $O(2n) = O(n)$; $O(n^2/2) = O(n^2)$.
  lessons: [dsa.u1.l1, dsa.u1.l2]

- id: early-exit-lowers-worst-case
  short: "An early return helps only on lucky inputs — the worst case never triggers it."
  explain: |
    The worst case is the input that makes the algorithm do the most work, e.g. no duplicates at all.
  lessons: [dsa.u1.l1]

- id: loops-add-not-multiply
  short: "Nested loops multiply; only loops one after the other add."
  explain: |
    A loop of $n$ inside a loop of $n$ runs its body $n \times n$ times. Two separate loops run $n + n$.
  lessons: [dsa.u1.l1, dsa.u1.l2]

- id: big-o-means-worst-case
  short: "Big-O is a bound on a function — best, worst and average cases each have their own."
  explain: |
    "Worst case $O(n^2)$, best case $O(1)$" is a perfectly sensible statement. Worst case is just the one usually quoted.
  lessons: [dsa.u1.l1]

- id: early-exit-ignored
  short: "`return` leaves the function at once — both loops stop."
  explain: |
    When the first comparison succeeds, nothing else runs: that's $O(1)$.
  lessons: [dsa.u1.l1]

- id: best-worst-swap
  short: "No duplicates is the *worst* case — every pair must be checked."
  explain: |
    The best case is the input that lets the algorithm stop soonest.
  lessons: [dsa.u1.l1]

- id: linear-scaling-assumed
  short: "That's how a linear algorithm scales; this one is quadratic."
  explain: |
    For $O(n^2)$, multiplying $n$ by $k$ multiplies the work by $k^2$.
  lessons: [dsa.u1.l1, dsa.u1.l2]

- id: cubic-scaling
  short: "That's cubic (n³) scaling."
  explain: |
    Match the scaling to the Big-O class: $n^2$ means ×$k^2$ for ×$k$ input.
  lessons: [dsa.u1.l1]

- id: constant-time-assumed
  short: "More input means more work for this algorithm."
  explain: |
    Only $O(1)$ algorithms take the same time regardless of $n$.
  lessons: [dsa.u1.l1]

- id: exponential-scaling
  short: "That's exponential growth (2¹⁰); n² grows much more gently."
  explain: |
    $(10n)^2 = 100 n^2$ — a factor of 100, not $2^{10} = 1024$.
  lessons: [dsa.u1.l1]

- id: additive-scaling
  short: "Running time grows by a factor, not by adding a fixed amount."
  explain: |
    If the work is $cn^2$, solve $c(kn)^2 = 100 \cdot cn^2$ for $k$.
  lessons: [dsa.u1.l1]

- id: set-lookup-linear
  short: "A set is a hash table: `x in seen` takes O(1) on average, not a scan."
  explain: |
    Lists check membership by scanning ($O(n)$); sets and dicts hash the key and look in one bucket ($O(1)$ average).
  lessons: [dsa.u1.l1, dsa.u3.l1]

- id: set-is-sorted
  short: "Python sets are hash tables, not sorted structures."
  explain: |
    Sets store items by hash, in no particular order; no sorting or tree is involved.
  lessons: [dsa.u1.l1]

- id: space-ignored
  short: "A single variable can still hold a collection that grows with n."
  explain: |
    Count the memory the data structure holds, not the number of variable names.
  lessons: [dsa.u1.l1, dsa.u1.l3]

- id: ratio-n
  short: "Check the exact counts: the ratio isn't simply n."
  explain: |
    Divide the two counts exactly, e.g. $\frac{n(n-1)/2}{n} = \frac{n-1}{2}$.
  lessons: [dsa.u1.l1]

- id: ratio-constant-assumed
  short: "The gap between different growth rates isn't constant — it widens with n."
  explain: |
    $O(n^2)$ vs $O(n)$ differ by a factor that itself grows like $n$.
  lessons: [dsa.u1.l1]

- id: ratio-as-difference
  short: "'How many times' asks for a ratio — divide, don't subtract."
  explain: |
    "$a$ is $k$ times $b$" means $a / b = k$.
  lessons: [dsa.u1.l1]

- id: boundary-off-by-one
  short: "Check the boundary: 'more than' excludes the equality case."
  explain: |
    If $(n-1)/2 > 1000$, then $n = 2001$ gives exactly 1000, which is not more than 1000.
  lessons: [dsa.u1.l1, dsa.u1.l2]

- id: quadratic-root-confusion
  short: "The ratio here is linear in n — no square root needed."
  explain: |
    Solve the inequality you actually have: $(n-1)/2 > 1000$.
  lessons: [dsa.u1.l1]

- id: exponential-vs-polynomial
  short: "Exponentials eventually beat every polynomial."
  explain: |
    $2^n$ doubles with each extra item; $n^2$ grows by about $2n$. By $n = 20$, $2^n$ is over a million while $n^2$ is 400.
  lessons: [dsa.u1.l1, dsa.u1.l4]

- id: nlogn-vs-n2
  short: "n log n is far below n²: log n grows much more slowly than n."
  explain: |
    $n \log n = n \times \log n$ and $n^2 = n \times n$; since $\log n \ll n$, $n \log n \ll n^2$.
  lessons: [dsa.u1.l1]

- id: log-bigger-than-linear
  short: "log n grows much more slowly than n."
  explain: |
    $\log_2$ of a million is about 20. Logarithms are the slowest-growing functions in common use.
  lessons: [dsa.u1.l1, dsa.u1.l2]

- id: guess-not-halving
  short: "To halve the possibilities every time, guess the middle."
  explain: |
    A guess off-centre can leave more than half the numbers in the worst case. Guessing
    $\lfloor(\text{lo} + \text{hi})/2\rfloor$ guarantees halving: $\lceil\log_2(n+1)\rceil$ guesses at most.
  lessons: [dsa.u1.l1]

# ── dsa.u1.l2: analysing loops ──
- id: range-end-included
  short: "range(start, stop, …) stops *before* stop — the stop value is excluded."
  explain: |
    `range(0, 12, 3)` gives 0, 3, 6, 9. A `while i < n` loop likewise never runs with `i == n`.
  lessons: [dsa.u1.l2]

- id: range-starts-at-step
  short: "The first value is the start (0 or 1), not the first step."
  explain: |
    The loop body runs once with the starting value before anything is added or multiplied.
  lessons: [dsa.u1.l2]

- id: step-ignored
  short: "The loop jumps by its step, so it runs fewer times than n."
  explain: |
    `range(0, n, k)` runs about $n/k$ times.
  lessons: [dsa.u1.l2]

- id: step-multiplies
  short: "A bigger step means *fewer* iterations, not more."
  explain: |
    Stepping by $k$ divides the count by $k$: $\lceil n/k \rceil$.
  lessons: [dsa.u1.l2]

- id: floor-instead-of-ceil
  short: "Don't forget the iteration at the start value — round up, not down."
  explain: |
    Values $0, k, 2k, \dots$ below $n$: there are $\lceil n/k \rceil$ of them.
  lessons: [dsa.u1.l2]

- id: doubling-as-linear
  short: "Doubling (or halving) reaches n in about log₂ n steps, not n/2."
  explain: |
    1, 2, 4, …, 512 is only 10 values. Multiplying by 2 each pass makes the loop logarithmic.
  lessons: [dsa.u1.l2]

- id: nested-loops-always-n2
  short: "Nested loops are n² only if both run about n times — check each loop's own count."
  explain: |
    Multiply the actual iteration counts: $n$ outer × $\log n$ inner is $n \log n$; shrinking inner
    loops need a sum.
  lessons: [dsa.u1.l2]

- id: outer-loop-ignored
  short: "The inner loop runs again for every pass of the outer loop."
  explain: |
    Multiply the inner count by the number of outer iterations.
  lessons: [dsa.u1.l2]

- id: shrinking-inner-ignored
  short: "Most outer passes have a large inner loop — the small ones don't make it cheap."
  explain: |
    Sum the inner counts over all outer passes; the larger half dominates.
  lessons: [dsa.u1.l2]

- id: inner-loop-ignored
  short: "Every loop level contributes — don't stop counting one level early."
  explain: |
    Each nested loop multiplies (or, if dependent, sums) the work of the levels above it.
  lessons: [dsa.u1.l2]

- id: shrinking-inner-is-log
  short: "An inner loop that shrinks by one each time averages n/2 — that's linear, not log."
  explain: |
    Logarithmic loops halve or double. $(n-1) + (n-2) + \dots$ is still about $n^2/2$.
  lessons: [dsa.u1.l2]

- id: triangular-is-linear
  short: "The average inner length is n/2, which grows with n."
  explain: |
    $n$ outer passes × an average of $n/2$ inner passes is quadratic.
  lessons: [dsa.u1.l2]

- id: sequential-multiplies
  short: "Loops one after another add their counts; only nested loops multiply."
  explain: |
    Run A then B: cost A + cost B. Run B inside A: cost A × cost B.
  lessons: [dsa.u1.l2]

- id: lower-order-dropped-in-count
  short: "Big-O may drop the smaller loop, but an exact count must include it."
  explain: |
    Exact counts add every loop; only the Big-O simplification keeps just the dominant term.
  lessons: [dsa.u1.l2]

# ── dsa.u1.l3: recursion ──
- id: base-case-confused
  short: "The base case answers directly — it's the line that does *not* call the function again."
  explain: |
    Every recursive function needs a case it can answer without recursing, checked before the recursive call.
  lessons: [dsa.u1.l3]

- id: base-case-is-definition
  short: "`def` only names the function; the base case is the condition that stops the recursion."
  explain: |
    Look for the branch that returns a value without calling the function again.
  lessons: [dsa.u1.l3]

- id: recursion-infinite
  short: "Recursion stops when each call moves toward a base case that is actually reached."
  explain: |
    The argument must get smaller (or simpler) every call. Calling with the same argument, or skipping past the base
    case, recurses forever (Python raises RecursionError after about 1000 frames).
  lessons: [dsa.u1.l3]

- id: off-by-one-recursion
  short: "The outermost call's own factor counts too."
  explain: |
    fact(n) = n × fact(n − 1): expand all the way down and multiply every factor from n to 1.
  lessons: [dsa.u1.l3]

- id: recursion-one-level
  short: "The recursion continues all the way to the base case, not just one level."
  explain: |
    fact(n − 1) is itself n − 1 × fact(n − 2), and so on, until fact(0).
  lessons: [dsa.u1.l3]

- id: sum-instead-of-product
  short: "fact multiplies the numbers; it doesn't add them."
  explain: |
    n × fact(n − 1) builds a product: n × (n − 1) × … × 1.
  lessons: [dsa.u1.l3]

- id: base-case-always-hit
  short: "A base case only triggers if the argument actually reaches it."
  explain: |
    With base case n == 1, calling fact(0) goes 0, −1, −2, … and never reaches 1.
  lessons: [dsa.u1.l3]

- id: stack-not-growing
  short: "Each pending call keeps its own stack frame until it returns."
  explain: |
    fact(n) has n + 1 frames on the stack at the deepest point.
  lessons: [dsa.u1.l3]

- id: frames-discarded
  short: "Frames stay on the stack until their call returns — callers wait."
  explain: |
    A caller can't finish until the call it made returns, so all the frames above the base case are still there.
  lessons: [dsa.u1.l3]

- id: recursion-sequential
  short: "A recursive call must finish before its caller can — they nest, not queue."
  explain: |
    `n * fact(n - 1)` can't be computed until `fact(n - 1)` returns.
  lessons: [dsa.u1.l3]

- id: base-frame-forgotten
  short: "Count the base-case call too."
  explain: |
    fact(n) goes n, n − 1, …, 1, 0: that's n + 1 calls.
  lessons: [dsa.u1.l3]

- id: depth-equals-result
  short: "The depth is the number of nested calls, not the size of the result."
  explain: |
    fact(170) is a huge number but only 171 frames deep. Python integers can be arbitrarily large.
  lessons: [dsa.u1.l3]

- id: stack-unlimited
  short: "Python limits recursion depth (about 1000 frames by default)."
  explain: |
    Deep recursion raises RecursionError even if the algorithm is efficient. Use a loop for deep chains.
  lessons: [dsa.u1.l3]

- id: linear-recursion-assumed
  short: "Each call can make two calls — the tree repeats work, so it's not one call per n."
  explain: |
    fib(n) calls fib(n − 1) and fib(n − 2), and those overlap: the same values are recomputed many times.
  lessons: [dsa.u1.l3]

- id: exactly-2-to-n
  short: "The tree is lopsided (fib(n − 2) is shallower), so it's fewer than 2ⁿ calls."
  explain: |
    The call count grows like φⁿ ≈ 1.618ⁿ — exponential, but below 2ⁿ.
  lessons: [dsa.u1.l3]

- id: calls-equal-result
  short: "That's a Fibonacci *value*, not a count of calls or subproblems."
  explain: |
    calls(n) = 1 + calls(n − 1) + calls(n − 2), which differs from fib(n).
  lessons: [dsa.u1.l3]

- id: recursion-quadratic
  short: "Branching multiplies at every level — that's exponential, not a polynomial."
  explain: |
    b branches per call and depth n give up to bⁿ calls.
  lessons: [dsa.u1.l3]

- id: recursion-halves
  short: "n shrinks by 1 or 2 per call, not by half — so the depth is n, not log n."
  explain: |
    Logarithmic recursion needs the problem size to be divided, e.g. n // 2.
  lessons: [dsa.u1.l3]

- id: branching-ignored
  short: "More recursive calls per call make the tree grow faster."
  explain: |
    The growth base solves xᵏ = xᵏ⁻¹ + … + 1; more terms give a larger base.
  lessons: [dsa.u1.l3]

- id: memo-no-effect
  short: "With a memo, each subproblem is solved once — later requests are look-ups."
  explain: |
    Memoisation turns naive fib's exponential tree into n + 1 subproblems, O(n) time.
  lessons: [dsa.u1.l3]

- id: memo-counts-calls
  short: "Distinguish subproblems solved from calls made — memo hits are cheap calls."
  explain: |
    Memoised fib(n) solves n + 1 subproblems but enters the function about 2n − 1 times.
  lessons: [dsa.u1.l3]

- id: memo-stores-base
  short: "In this version base cases return directly and aren't stored."
  explain: |
    Only n ≥ 2 goes through the `memo[n] = …` line.
  lessons: [dsa.u1.l3]

- id: memo-constant-time
  short: "The memo avoids *repeated* work; the first computation still visits every n."
  explain: |
    Each subproblem is solved once: that's O(n) work, not O(1).
  lessons: [dsa.u1.l3]

- id: memo-assumed
  short: "Without a memo nothing is remembered — each subproblem is recomputed every time."
  explain: |
    In naive fib(n), fib(1) is called fib(n) times.
  lessons: [dsa.u1.l3]

# ── dsa.u1.l4: recurrences ──
- id: level-work-only
  short: "That's the work at one level (or one call) — add up every level of the tree."
  explain: |
    Total cost = sum over levels of (calls at the level × work per call).
  lessons: [dsa.u1.l4]

- id: two-calls-double
  short: "The halves keep splitting at every level — it's not just two calls' worth."
  explain: |
    Unroll the recurrence all the way down; each level contributes.
  lessons: [dsa.u1.l4]

- id: balance-ignored
  short: "n log n needs balanced splits; peeling off one element gives n levels."
  explain: |
    T(n) = T(n − 1) + n sums to about n²/2. Balance is what makes divide-and-conquer fast.
  lessons: [dsa.u1.l4]

- id: level-work-halves
  short: "The calls double while the sizes halve, so each level's total stays n."
  explain: |
    Level j has 2ʲ calls of size n/2ʲ: 2ʲ × n/2ʲ = n.
  lessons: [dsa.u1.l4]

- id: subproblem-size-ignored
  short: "Subproblems shrink as you go down the tree."
  explain: |
    At depth j each call works on n/bʲ items, not n.
  lessons: [dsa.u1.l4]

- id: tree-levels-linear
  short: "The number of calls multiplies by a at each level — it doesn't grow by one."
  explain: |
    Depth j has aʲ calls.
  lessons: [dsa.u1.l4]

- id: subproblem-count-ignored
  short: "Count every node, not one per level."
  explain: |
    With two calls per node, level j has 2ʲ nodes.
  lessons: [dsa.u1.l4]

- id: leaves-only
  short: "The internal nodes do work too — not just the leaves."
  explain: |
    1 + 2 + 4 + … + n = 2n − 1: the internal nodes add almost as much as the leaves.
  lessons: [dsa.u1.l4]

- id: master-case-confused
  short: "Compare a with bᵈ to pick the master-theorem case."
  explain: |
    a = bᵈ: every level equal → nᵈ log n. a < bᵈ: top dominates → nᵈ. a > bᵈ: leaves dominate → n^(log_b a).
  lessons: [dsa.u1.l4]

- id: master-scope
  short: "The master theorem covers any T(n) = a·T(n/b) + O(nᵈ)."
  explain: |
    Identify a (calls), b (shrink factor) and d (extra work exponent), then compare a with bᵈ.
  lessons: [dsa.u1.l4]

- id: calls-as-exponent
  short: "The exponent is log_b a, not a."
  explain: |
    4T(n/2) + n has 4 calls on halves: n^(log₂ 4) = n², not n⁴.
  lessons: [dsa.u1.l4]

- id: decrement-recursion-cheap
  short: "Shrinking by one per call gives n levels — with n work each, that's n²."
  explain: |
    T(n) = T(n − 1) + n = n + (n − 1) + … + 1 ≈ n²/2.
  lessons: [dsa.u1.l4]

- id: log-base-matters
  short: "A different log base is just a constant factor."
  explain: |
    log₃ n = log₂ n / log₂ 3, so O(log₃ n) = O(log₂ n) = O(log n).
  lessons: [dsa.u1.l4]

- id: two-calls-ignored
  short: "Calling the function twice on the half doubles the calls at every level."
  explain: |
    T(n) = 2T(n/2) + 1 is O(n). Compute the half once and reuse it: T(n) = T(n/2) + 1 = O(log n).
  lessons: [dsa.u1.l4]

# ── dsa.u1.l5: amortized analysis ──
- id: growth-by-one
  short: "Growing by one slot would resize (and copy everything) on every append."
  explain: |
    Dynamic arrays grow by a constant *factor* so that resizes become rarer as the array grows.
  lessons: [dsa.u1.l5]

- id: growth-additive
  short: "That's growing by a fixed amount, not doubling."
  explain: |
    Doubling multiplies the capacity: 1, 2, 4, 8, … A fixed increment adds: 1, 11, 21, …
  lessons: [dsa.u1.l5]

- id: capacity-preallocated
  short: "The array can't know in advance how many items are coming — it grows as needed."
  explain: |
    Capacity starts small and grows by resizing; spare capacity exists only right after a resize.
  lessons: [dsa.u1.l5]

- id: last-resize-only
  short: "Every resize copies — add them all, not just the last one."
  explain: |
    Doubling: 1 + 2 + 4 + … + n/2 = n − 1 copies in total.
  lessons: [dsa.u1.l5]

- id: copies-quadratic
  short: "With doubling the copies form a geometric sum — linear, not quadratic."
  explain: |
    Quadratic copying happens only with fixed-size increments.
  lessons: [dsa.u1.l5]

- id: copies-count-resizes
  short: "That's the number of resizes; each resize copies many items."
  explain: |
    Count items copied: each resize copies the whole current contents.
  lessons: [dsa.u1.l5]

- id: growth-factor-scales-copies
  short: "A larger growth factor means *fewer* resizes and fewer copies, not more."
  explain: |
    With factor r, total copies are at most r/(r − 1) × n: 2n for r = 2, 1.5n for r = 3, 3n for r = 1.5.
  lessons: [dsa.u1.l5]

- id: growth-factor-ignored
  short: "Growing by a factor and growing by a fixed amount behave very differently."
  explain: |
    Geometric growth (×r) gives amortized O(1); arithmetic growth (+c) gives amortized O(n).
  lessons: [dsa.u1.l5]

- id: amortized-worst-step
  short: "That's the most expensive single append, not the cost averaged over the sequence."
  explain: |
    Amortized cost = total cost ÷ number of operations.
  lessons: [dsa.u1.l5]

- id: copies-ignored
  short: "The copying during resizes is part of the total cost."
  explain: |
    Count writes *and* copies, then divide by the number of appends.
  lessons: [dsa.u1.l5]

- id: writes-ignored
  short: "Each append also writes its own item — count the writes too."
  explain: |
    Total work = n writes + all the copies.
  lessons: [dsa.u1.l5]

- id: amortized-log
  short: "The number of resizes is log n, but the amortized cost per append is constant."
  explain: |
    With doubling, writes + copies < 3n, so the cost per append is below 3.
  lessons: [dsa.u1.l5]

- id: amortized-every-step
  short: "Amortized O(1) bounds the whole sequence — one step can still be O(n)."
  explain: |
    The resizing append copies everything. Amortized analysis spreads that cost, but it still happens in one step.
  lessons: [dsa.u1.l5]

- id: amortized-is-average-case
  short: "Amortized is a worst-case guarantee over any sequence — no randomness involved."
  explain: |
    Average-case analysis assumes a distribution of inputs; amortized analysis bounds the total for every sequence.
  lessons: [dsa.u1.l5]

# ── dsa.u2.l1: arrays ──
- id: one-based-index
  short: "Indices start at 0: element i comes after i elements."
  explain: |
    arr[0] is at the base address; arr[i] is i elements later, at B + s·i.
  lessons: [dsa.u2.l1]

- id: address-before-base
  short: "Nothing is stored before the start of the block."
  explain: |
    The array's first element sits exactly at the base address.
  lessons: [dsa.u2.l1]

- id: base-ignored
  short: "The offset is added to the base address."
  explain: |
    Address = base + element size × index.
  lessons: [dsa.u2.l1]

- id: address-ignores-size
  short: "Multiply the index by the element size — each element takes several bytes."
  explain: |
    With 4-byte integers, consecutive elements are 4 addresses apart.
  lessons: [dsa.u2.l1]

- id: row-column-swap
  short: "Row-major order: skip whole rows first (row × columns), then add the column."
  explain: |
    Element (r, c) in a table with C columns is element r·C + c of the flat array.
  lessons: [dsa.u2.l1]

- id: access-scans
  short: "Arrays compute an element's address directly — no scanning."
  explain: |
    arr[i] is at B + s·i: O(1). Following links one by one is what *linked lists* must do.
  lessons: [dsa.u2.l1, dsa.u2.l2]

- id: access-from-end
  short: "Position in the array doesn't affect access time."
  explain: |
    Any index needs the same single address calculation.
  lessons: [dsa.u2.l1]

- id: access-depends-on-n
  short: "The array's length doesn't enter the address formula."
  explain: |
    B + s·i costs the same for 10 elements or 10 million.
  lessons: [dsa.u2.l1]

- id: access-binary-search
  short: "Indexing goes straight to a position; binary search is for finding a *value* in sorted data."
  explain: |
    Reading arr[i] is O(1). Binary search (O(log n)) answers "where is this value?" in a sorted array.
  lessons: [dsa.u2.l1]

- id: index-vs-value-search
  short: "Fast indexing needs the position — finding an unknown value still means checking elements."
  explain: |
    In unsorted data you must scan, O(n), even though each individual read is O(1).
  lessons: [dsa.u2.l1]

- id: array-insert-free
  short: "Arrays have no gaps in the middle — elements must shift to make room."
  explain: |
    Any spare capacity is at the end. Inserting at index k moves the n − k elements after it.
  lessons: [dsa.u2.l1]

- id: shift-wrong-side
  short: "Only the elements after the insertion point move — and the rightmost moves first."
  explain: |
    Shifting right must start at the end so no element is overwritten before it has moved.
  lessons: [dsa.u2.l1]

- id: shift-one-only
  short: "Moving one element would overwrite the next — they all have to move."
  explain: |
    Every element from the insertion point to the end shifts one place.
  lessons: [dsa.u2.l1]

- id: shift-everything
  short: "Elements before the insertion point stay where they are."
  explain: |
    Inserting at index k shifts n − k elements, not all n (unless k = 0).
  lessons: [dsa.u2.l1]

- id: array-delete-free
  short: "Deleting leaves a gap that the later elements must close."
  explain: |
    Arrays can't have holes: deleting index k shifts the n − k − 1 later elements left.
  lessons: [dsa.u2.l1]

- id: array-front-insert-O1
  short: "Inserting or removing at the front of an array shifts every element — O(n)."
  explain: |
    list.insert(0, x) and list.pop(0) are linear. Use collections.deque for O(1) operations at the front.
  lessons: [dsa.u2.l1, dsa.u2.l4]

- id: array-end-ops-slow
  short: "Operations at the *end* need no shifting: append is amortized O(1), pop() is O(1)."
  explain: |
    Only front and middle operations shift elements.
  lessons: [dsa.u2.l1]

- id: deque-strictly-better
  short: "Every structure trades something: a deque gives up fast indexing in the middle."
  explain: |
    CPython's deque is a linked list of blocks: O(1) at both ends, O(n) for d[i] in the middle.
  lessons: [dsa.u2.l1]

- id: deque-types
  short: "Deques hold any Python objects, like lists."
  explain: |
    The trade-off is in operation costs, not in what can be stored.
  lessons: [dsa.u2.l1]

- id: shift-to-sort
  short: "Shifting keeps the existing order (whatever it is) and makes room — it doesn't sort."
  explain: |
    Contiguous storage means a middle insert needs a free slot, so the later elements move right.
  lessons: [dsa.u2.l1]

# ── dsa.u2.l2: linked lists ──
- id: linked-random-access
  short: "Linked lists have no random access — reaching position k means following k links."
  explain: |
    Nodes are scattered in memory, so there's no address formula. Access is O(k), O(n) in the worst case.
  lessons: [dsa.u2.l2]

- id: traverse-whole-list
  short: "You only walk as far as you need — and head operations need no walk at all."
  explain: |
    Reaching position k takes k links; inserting or deleting at the head takes none.
  lessons: [dsa.u2.l2]

- id: walk-reused
  short: "Each get(i) call starts again from the head."
  explain: |
    Calling get(i) for every i costs 0 + 1 + … + (n − 1). Iterate with node = node.next instead.
  lessons: [dsa.u2.l2]

- id: linked-insert-shifts
  short: "Linked-list nodes never move — only pointers change."
  explain: |
    Inserting or deleting next to a node you hold is O(1): no shifting.
  lessons: [dsa.u2.l2]

- id: pointer-order-wrong
  short: "Overwriting a next pointer first loses the rest of the list."
  explain: |
    Link the new node to its successor (new.next = p.next) before redirecting p.next.
  lessons: [dsa.u2.l2]

- id: pointer-direction-wrong
  short: "Check which way the pointer goes — that assignment points the wrong way or makes a cycle."
  explain: |
    In a singly linked list each node points to its successor. Reversal makes each node point to its predecessor.
  lessons: [dsa.u2.l2]

- id: head-insert-order
  short: "Each head insert puts the new value in front, so the list comes out reversed."
  explain: |
    Inserting 1, 2, 3 at the head gives 3 → 2 → 1.
  lessons: [dsa.u2.l2]

- id: pointer-variable-confusion
  short: "Rebinding a local variable doesn't change the list's links."
  explain: |
    p = p.next only moves your finger along the list; to edit it, assign to a .next field.
  lessons: [dsa.u2.l2]

- id: tail-pointer-assumed
  short: "Without a tail pointer, reaching the end means walking the whole list."
  explain: |
    Keep a tail reference to append in O(1).
  lessons: [dsa.u2.l2]

- id: delete-cuts-list
  short: "Setting next to None cuts off everything after it, not just one node."
  explain: |
    To remove one node, bypass it: p.next = p.next.next.
  lessons: [dsa.u2.l2]

- id: doubly-one-side
  short: "In a doubly linked list both neighbours point at the node — update both."
  explain: |
    x.prev.next = x.next and x.next.prev = x.prev.
  lessons: [dsa.u2.l2]

- id: structures-equivalent
  short: "Arrays and linked lists have opposite strengths — pick by the operations you need."
  explain: |
    Arrays: O(1) indexing, O(n) middle inserts. Linked lists: O(1) splicing at a held node, O(n) to reach a position.
  lessons: [dsa.u2.l2]

# ── dsa.u2.l3: stacks ──
- id: stack-as-queue
  short: "That's first-in-first-out — a queue. A stack returns the most recent item."
  explain: |
    Stacks are LIFO: push and pop happen at the same end, the top.
  lessons: [dsa.u2.l3]

- id: pop-returns-all
  short: "pop removes and returns one item — the top."
  explain: |
    Each pop takes exactly one item off the stack.
  lessons: [dsa.u2.l3]

- id: pop-no-value
  short: "pop both removes the top item and returns it."
  explain: |
    Use peek (lst[-1]) to look without removing.
  lessons: [dsa.u2.l3]

- id: pop-not-removed
  short: "A popped item is gone from the stack."
  explain: |
    After pop, the next item down becomes the top.
  lessons: [dsa.u2.l3]

- id: stack-size-miscount
  short: "Track the stack step by step: each push adds one, each pop removes one."
  explain: |
    Write out the stack contents after every operation.
  lessons: [dsa.u2.l3]

- id: stack-order-fixed
  short: "Interleaving pushes and pops allows many output orders — just not all of them."
  explain: |
    An order is possible unless it needs an item from below the top.
  lessons: [dsa.u2.l3]

- id: stack-ends-mixed
  short: "Push and pop must use the same end of the list."
  explain: |
    Using opposite ends turns the stack into a queue.
  lessons: [dsa.u2.l3]

- id: stack-holds-all
  short: "Only opening brackets are stored; closers pop them."
  explain: |
    The stack holds the openers still waiting to be closed.
  lessons: [dsa.u2.l3]

- id: push-closers
  short: "Closing brackets are never pushed — they pop a matching opener."
  explain: |
    Push on (, [, {; on ), ], } check and pop the top.
  lessons: [dsa.u2.l3]

- id: brackets-any-match
  short: "A closer must match the *top* exactly — same kind, most recent opener."
  explain: |
    `([)]` fails because at `)` the top is `[`.
  lessons: [dsa.u2.l3]

- id: brackets-skip
  short: "Every bracket matters to the check."
  explain: |
    A non-matching closer means the string is unbalanced; it can't be skipped.
  lessons: [dsa.u2.l3]

- id: brackets-same-kind
  short: "Different kinds are fine as long as each closes properly."
  explain: |
    `([])` is balanced: every closer matches the top when it arrives.
  lessons: [dsa.u2.l3]

- id: empty-mid-unbalanced
  short: "An empty stack in the middle just means one group is complete."
  explain: |
    Only the *end* state (and mismatches) decide the verdict.
  lessons: [dsa.u2.l3]

- id: nesting-limit
  short: "Deep nesting is fine — the stack simply grows."
  explain: |
    Balance depends on matching order, not depth.
  lessons: [dsa.u2.l3]

- id: brackets-count-only
  short: "Counting brackets isn't enough — order matters, and a closer needs an opener before it."
  explain: |
    `)(` has equal counts but is unbalanced.
  lessons: [dsa.u2.l3]

- id: nge-looks-left
  short: "The next greater element is to the *right*."
  explain: |
    Scan forward from the element for the first larger value.
  lessons: [dsa.u2.l3]

- id: nge-maximum
  short: "It's the *first* larger value to the right, not the largest."
  explain: |
    The search stops at the first value that beats the element.
  lessons: [dsa.u2.l3]

- id: nge-next-element
  short: "The next element isn't necessarily larger — keep scanning until one is."
  explain: |
    The answer may be several positions to the right, or not exist at all.
  lessons: [dsa.u2.l3]

- id: monotonic-pop-once
  short: "Keep popping while the top is smaller than the new value."
  explain: |
    One new value can be the answer for several waiting values.
  lessons: [dsa.u2.l3]

- id: monotonic-pop-all
  short: "Stop popping at the first value larger than the new one."
  explain: |
    Larger waiting values haven't found their answer yet.
  lessons: [dsa.u2.l3]

- id: nge-always-exists
  short: "Values with nothing larger to their right have no next greater element."
  explain: |
    Whatever is left on the stack at the end has no answer (often reported as −1).
  lessons: [dsa.u2.l3]

- id: monotonic-quadratic
  short: "Each item is popped at most once in the whole run — total work is O(n), not n²."
  explain: |
    Count pops over the entire algorithm: at most one per pushed item.
  lessons: [dsa.u2.l3]

# ── dsa.u2.l4: queues & deques ──
- id: queue-as-stack
  short: "That's last-in-first-out — a stack. A queue serves the oldest item first."
  explain: |
    Queues are FIFO: items join at the back and leave from the front.
  lessons: [dsa.u2.l4]

- id: queue-middle
  short: "A queue only ever serves from the front."
  explain: |
    Items in the middle wait their turn; nothing jumps ahead.
  lessons: [dsa.u2.l4]

- id: queue-priority
  short: "A plain queue keeps arrival order, not size or priority order — that's a priority queue."
  explain: |
    Serving the smallest or most urgent item first needs a heap-based priority queue.
  lessons: [dsa.u2.l4]

- id: dequeue-not-removed
  short: "A dequeued item has left the queue."
  explain: |
    After a dequeue, the next item in line becomes the front.
  lessons: [dsa.u2.l4]

- id: queue-miscount
  short: "Track the queue step by step: enqueue adds at the back, dequeue removes the front."
  explain: |
    Write out the queue contents, front to back, after every operation.
  lessons: [dsa.u2.l4]

- id: queue-from-stacks
  short: "Two stacks do make a queue: moving items from one to the other reverses their order."
  explain: |
    Reversing twice restores arrival order, and each item moves at most once — amortized O(1).
  lessons: [dsa.u2.l4]

- id: tail-from-zero
  short: "Positions in a circular buffer are counted from the head, not from index 0."
  explain: |
    The i-th item (from 0) is at (head + i) mod C.
  lessons: [dsa.u2.l4]

- id: tail-off-by-one
  short: "The last item is at (head + size − 1) mod C; the next free slot is (head + size) mod C."
  explain: |
    Enqueue writes one past the last item. Mixing the two is an off-by-one error.
  lessons: [dsa.u2.l4]

- id: dequeue-resets
  short: "Indices never reset to 0 on their own — they only wrap when they pass the end."
  explain: |
    head and the back move forward one step at a time, mod C.
  lessons: [dsa.u2.l4]

- id: no-wraparound
  short: "A circular buffer's indices wrap: take every index mod C."
  explain: |
    After index C − 1 comes index 0. An index of C or more doesn't exist.
  lessons: [dsa.u2.l4]

- id: head-not-moving
  short: "Dequeue moves head forward to the next item."
  explain: |
    The removed slot is left behind; head = (head + 1) mod C.
  lessons: [dsa.u2.l4]

- id: size-not-updated
  short: "Every dequeue decreases size by one; every enqueue increases it."
  explain: |
    size counts the items currently in the queue.
  lessons: [dsa.u2.l4]

- id: head-moves-back
  short: "The queue advances forward: head goes to head + 1 (mod C)."
  explain: |
    Both head and the back only ever move forward around the ring.
  lessons: [dsa.u2.l4]

- id: queue-remove-by-value
  short: "list.remove(x) searches for x and shifts the rest — O(n)."
  explain: |
    A queue removes by position (the front), which a deque does in O(1).
  lessons: [dsa.u2.l4]

- id: list-is-circular
  short: "A Python list is not a circular buffer: pop(0) really shifts every element."
  explain: |
    Lists keep items in slots 0 … n − 1, so removing the first moves all the others down.
  lessons: [dsa.u2.l4]

- id: pop0-nlogn
  short: "Each pop(0) shifts all remaining items: (n − 1) + (n − 2) + … ≈ n²/2 — quadratic."
  explain: |
    There's no halving anywhere, so no log factor: the costs form an arithmetic series.
  lessons: [dsa.u2.l4]

- id: buffer-pointless
  short: "A fixed circular buffer guarantees bounded, preallocated memory — sometimes that's required."
  explain: |
    Real-time audio and network code can't afford allocation pauses or unbounded growth.
  lessons: [dsa.u2.l4]

- id: buffer-middle-insert
  short: "A circular buffer also has to shift elements to insert in the middle."
  explain: |
    It's fast only at its two ends, like a deque.
  lessons: [dsa.u2.l4]

- id: capacity-ignores-size
  short: "Free space is capacity minus the items already stored."
  explain: |
    Free slots = C − size.
  lessons: [dsa.u2.l4]

- id: one-slot-reserved
  short: "How many slots are usable depends on the design: tracking size uses all C; head/tail-only uses C − 1."
  explain: |
    The empty slot is only needed when head == tail would otherwise mean both full and empty.
  lessons: [dsa.u2.l4]

- id: space-to-end-only
  short: "Wrapping lets the free slots before the head be used too."
  explain: |
    The buffer is a ring: after the last index comes index 0.
  lessons: [dsa.u2.l4]

- id: maxlen-keeps-all
  short: "deque(maxlen=N) silently drops the oldest item when a new one arrives while full."
  explain: |
    Good for "keep the latest N", wrong for a work queue where every item must be served.
  lessons: [dsa.u2.l4]

- id: overwrite-ok
  short: "Overwriting the oldest item loses work that hasn't been served."
  explain: |
    A work queue must grow, block, or reject — never silently drop.
  lessons: [dsa.u2.l4]

- id: single-end-enough
  short: "That task only removes from one end — a plain queue or stack is enough."
  explain: |
    A deque earns its place when you add or remove at *both* ends.
  lessons: [dsa.u2.l4]

- id: deque-for-indexing
  short: "Lookup by index is an array's job; a deque's strength is its two ends."
  explain: |
    Python's deque is O(n) for d[i] in the middle.
  lessons: [dsa.u2.l4]

- id: grow-reverses
  short: "Growing must keep FIFO order — the front stays the front."
  explain: |
    Copy from head onwards, in queue order, into the new array.
  lessons: [dsa.u2.l4]

- id: brackets-need-deque
  short: "Bracket matching only pushes and pops at the top — a stack is enough."
  explain: |
    Openers go on top; each closer checks and pops the top. One end only.
  lessons: [dsa.u2.l4]

# ── dsa.u2.l5: two pointers ──
- id: pairs-n-squared
  short: "An item can't pair with itself, and {A, B} is the same pair as {B, A}: n(n − 1)/2 pairs."
  explain: |
    n² counts ordered pairs and self-pairs; halve n(n − 1) instead.
  lessons: [dsa.u2.l5]

- id: pairs-linear
  short: "The number of pairs grows like n², not n."
  explain: |
    Each of the n items pairs with n − 1 others.
  lessons: [dsa.u2.l5]

- id: pairs-cubic
  short: "Pairs grow like n² — 10× the items is about 100× the pairs, not 1000×."
  explain: |
    Cubic growth would come from triples, not pairs.
  lessons: [dsa.u2.l5]

- id: pairs-growth-guess
  short: "Pair counts grow quadratically: 10× the items means about 100× the work."
  explain: |
    n(n − 1)/2 is roughly n²/2.
  lessons: [dsa.u2.l5]

- id: tp-wrong-pointer
  short: "Too small → move lo right (bigger values); too large → move hi left (smaller values)."
  explain: |
    In a sorted array, moving right increases the value and moving left decreases it.
  lessons: [dsa.u2.l5]

- id: tp-move-both
  short: "Only one pointer moves per step — moving both can skip the answer."
  explain: |
    If the sum is too small, a[hi] may still be part of the answer with a bigger a[lo].
  lessons: [dsa.u2.l5]

- id: tp-restart
  short: "Two pointers never looks back: discarded values can't be in any answer."
  explain: |
    Restarting would make it quadratic again.
  lessons: [dsa.u2.l5]

- id: tp-gives-up
  short: "The scan only stops on a match or when lo meets hi."
  explain: |
    A single bad sum just tells you which pointer to move.
  lessons: [dsa.u2.l5]

- id: tp-smallest-never
  short: "The smallest element can be part of the answer — it just gets discarded once its best partner fails."
  explain: |
    [1, 9] with target 10 uses the smallest element.
  lessons: [dsa.u2.l5]

- id: tp-index-reason
  short: "The argument rests on the sorted *values*, not on comparing indices."
  explain: |
    a[hi] is the largest value still in play; that's what makes the discard safe.
  lessons: [dsa.u2.l5]

- id: tp-heuristic
  short: "Two pointers is exact: each discard is proven safe, so meeting proves there's no pair."
  explain: |
    A discarded value's best possible partner already failed.
  lessons: [dsa.u2.l5]

- id: tp-counts-elements
  short: "Count the sums, not the elements: the pointers stop when they meet."
  explain: |
    With n elements there are at most n − 1 sums.
  lessons: [dsa.u2.l5]

- id: tp-skips-first
  short: "Every sum computed counts — including the first and the matching one."
  explain: |
    Write down each sum as you trace.
  lessons: [dsa.u2.l5]

- id: tp-arithmetic
  short: "Recheck the arithmetic at each step."
  explain: |
    Write each sum down before deciding which pointer moves.
  lessons: [dsa.u2.l5]

- id: tp-no-termination
  short: "Every step moves a pointer inward, so the scan always ends."
  explain: |
    The gap hi − lo shrinks by one each step.
  lessons: [dsa.u2.l5]

- id: tp-quadratic
  short: "Two pointers computes at most n − 1 sums — checking every pair is brute force."
  explain: |
    Each sum moves one pointer inward: O(n), not O(n²).
  lessons: [dsa.u2.l5]

- id: tp-needs-distinct
  short: "Duplicates are fine — two pointers only needs sorted order."
  explain: |
    Equal values just mean equal sums; the rules still hold.
  lessons: [dsa.u2.l5]

- id: tp-needs-positive
  short: "Negative values work too — only the order matters."
  explain: |
    Sorted ascending means moving right never decreases the value.
  lessons: [dsa.u2.l5]

- id: sort-free
  short: "Sorting costs O(n log n) — it can't be skipped in the total."
  explain: |
    Sequential steps add: n log n + n = O(n log n).
  lessons: [dsa.u2.l5]

- id: costs-multiply
  short: "Sequential steps add their costs; nested steps multiply."
  explain: |
    Sort, then scan: n log n + n.
  lessons: [dsa.u2.l5]

- id: sort-keeps-indices
  short: "Sorting moves values, so sorted positions differ from the original ones."
  explain: |
    Sort (value, index) pairs to remember where each value came from.
  lessons: [dsa.u2.l5]

- id: tp-impossible-unsorted
  short: "Once the data is sorted, the scan works — the original order doesn't matter."
  explain: |
    Sort first (keeping indices if needed), then scan.
  lessons: [dsa.u2.l5]

- id: reverse-swaps-middle
  short: "With an odd length the middle element stays put — no swap needed."
  explain: |
    n elements need ⌊n/2⌋ swaps.
  lessons: [dsa.u2.l5]

- id: merge-one-list
  short: "Every item from both lists must be placed."
  explain: |
    Each comparison places one item.
  lessons: [dsa.u2.l5]

- id: merge-last-compare
  short: "When one list runs out, the rest is copied without comparing."
  explain: |
    So at least the last item needs no comparison: at most 2n − 1.
  lessons: [dsa.u2.l5]

- id: tp-one-pair
  short: "When a[lo] + a[hi] fits, every partner between lo and hi fits too (they're smaller)."
  explain: |
    Count hi − lo pairs at once; with repeats, look for the leftmost equal partner.
  lessons: [dsa.u2.l5]

- id: tp-count-from-zero
  short: "Partners for lo start at lo + 1, not at index 0."
  explain: |
    Pairs (lo, k) with lo < k ≤ hi: that's hi − lo of them.
  lessons: [dsa.u2.l5]

- id: tp-count-all-later
  short: "Partners beyond hi were discarded because they were already too big."
  explain: |
    Only indices lo + 1 … hi pair with lo within the target.
  lessons: [dsa.u2.l5]

- id: sorted-indices-reported
  short: "Indices in the sorted copy refer to the new order, not to the positions you were given."
  explain: |
    Carry each value's original index through the sort and report that.
  lessons: [dsa.u2.l5]

# ── dsa.u2.l6: sliding window ──
- id: windows-disjoint
  short: "Windows overlap: they start one position apart, so there are n − k + 1 of them, not n / k."
  explain: |
    n / k counts non-overlapping blocks.
  lessons: [dsa.u2.l6]

- id: windows-off-by-one
  short: "Count both ends: starts run from 0 to n − k inclusive."
  explain: |
    That's n − k + 1 positions.
  lessons: [dsa.u2.l6]

- id: windows-equal-n
  short: "A window can't start in the last k − 1 positions — it would run off the end."
  explain: |
    Starts go from 0 to n − k.
  lessons: [dsa.u2.l6]

- id: windows-same-count
  short: "Shorter windows have more possible starts; adjacent windows share k − 1 values, not k."
  explain: |
    Length L gives n − L + 1 windows.
  lessons: [dsa.u2.l6]

- id: windows-all-lengths
  short: "Only lengths up to k count here, not every length up to n."
  explain: |
    Sum n − L + 1 for L = 1 … k.
  lessons: [dsa.u2.l6]

- id: window-sum-free
  short: "Each window costs something: k reads from scratch, or one add and one subtract when sliding."
  explain: |
    Only the sliding update is O(1) per window.
  lessons: [dsa.u2.l6]

- id: slide-cost-confused
  short: "One add and one subtract is the cost of a *slide*; a fresh sum reads every value."
  explain: |
    From scratch: k reads per window.
  lessons: [dsa.u2.l6]

- id: window-recompute
  short: "Sliding never rebuilds a window: each step updates the previous total."
  explain: |
    The k factor disappears — O(n) instead of O(nk).
  lessons: [dsa.u2.l6]

- id: slide-add-only
  short: "The value that left the window must be subtracted, or the window keeps growing."
  explain: |
    total += entering − leaving.
  lessons: [dsa.u2.l6]

- id: slide-wrong-leaving
  short: "The value that leaves is the window's leftmost one, a[i]."
  explain: |
    Everything else stays inside after the slide.
  lessons: [dsa.u2.l6]

- id: slide-arithmetic
  short: "Recheck the arithmetic: old total + entering − leaving."
  explain: |
    Write the update down before computing it.
  lessons: [dsa.u2.l6]

- id: max-like-sum
  short: "A maximum can't be undone by subtraction: if the max leaves, you need the runner-up."
  explain: |
    Sums have inverses; max doesn't. Sliding maxima keep a deque of candidates.
  lessons: [dsa.u2.l6]

- id: max-entering
  short: "The entering value is the max only if it beats everything else in the window."
  explain: |
    Compare it with the remaining values.
  lessons: [dsa.u2.l6]

- id: window-first-only
  short: "Check every window, not just the first."
  explain: |
    Slide to the end and keep the best total seen.
  lessons: [dsa.u2.l6]

- id: window-last-only
  short: "The final window isn't necessarily the best — track the best as you slide."
  explain: |
    Update best after every slide.
  lessons: [dsa.u2.l6]

- id: window-whole-array
  short: "The window has a fixed length (or must avoid repeats) — the whole array doesn't qualify."
  explain: |
    Respect the window rule.
  lessons: [dsa.u2.l6]

- id: repeat-ignored
  short: "A window with a repeated character doesn't count."
  explain: |
    Check every character inside the window, not just its ends.
  lessons: [dsa.u2.l6]

- id: window-restart
  short: "Don't restart the window — drop just enough from the left to fix it."
  explain: |
    Restarting throws away valid work and can miss the answer.
  lessons: [dsa.u2.l6]

- id: window-last-inside
  short: "A stored position can be stale — that copy may already be outside the window."
  explain: |
    Use i = max(i, last[ch] + 1) so the left end never moves back.
  lessons: [dsa.u2.l6]

- id: window-index-bound
  short: "last[ch] is always before j, so i can't pass j anyway."
  explain: |
    The max is about stale positions, not about j.
  lessons: [dsa.u2.l6]

- id: max-speed
  short: "It's about correctness, not speed."
  explain: |
    Without max, a stale position moves the left end backwards.
  lessons: [dsa.u2.l6]

- id: window-quadratic
  short: "A nested loop isn't automatically quadratic: count the total moves of each pointer."
  explain: |
    Both ends only move forward — at most 2n moves overall.
  lessons: [dsa.u2.l6]

- id: window-log
  short: "Nothing is halved in a sliding window, so there's no log factor."
  explain: |
    Count pointer moves: at most 2n.
  lessons: [dsa.u2.l6]

- id: best-starts-zero
  short: "With negative values the best window sum can be negative — start best at the first window, not at 0."
  explain: |
    best = sum(a[:k]) handles every case.
  lessons: [dsa.u2.l6]

# ── dsa.u2.l7: prefix sums ──
- id: range-length-off-by-one
  short: "Inclusive ranges count both ends: l … r has r − l + 1 values."
  explain: |
    Days 3 to 7 are 3, 4, 5, 6, 7 — five days.
  lessons: [dsa.u2.l7]

- id: range-from-zero
  short: "The range starts at l, not at index 0."
  explain: |
    Only a range starting at 0 is a whole prefix.
  lessons: [dsa.u2.l7]

- id: range-sum-free
  short: "Without preprocessing, a range sum reads every value in the range."
  explain: |
    Only a prefix array makes a question O(1) — after O(n) setup.
  lessons: [dsa.u2.l7]

- id: range-n-squared
  short: "The work is questions × range length: it depends on q, not on n twice."
  explain: |
    q questions of up to n values: O(nq).
  lessons: [dsa.u2.l7]

- id: range-sum-free-q
  short: "Each question reads many values, not one."
  explain: |
    A range of length L costs L reads with the plain loop.
  lessons: [dsa.u2.l7]

- id: range-always-full
  short: "That's the worst case; random ranges are shorter on average."
  explain: |
    A random range covers about a third of the array.
  lessons: [dsa.u2.l7]

- id: range-half
  short: "A random range [l, r] averages about a third of the array, not half."
  explain: |
    Both ends are random, which shortens the range.
  lessons: [dsa.u2.l7]

- id: prefix-includes-index
  short: "P[i] is the sum of the first i values, a[0 … i − 1] — it stops before index i."
  explain: |
    P[i + 1] is the first prefix that includes a[i].
  lessons: [dsa.u2.l7]

- id: prefix-is-value
  short: "P[i] is a running total, not a single value."
  explain: |
    P[i] = a[0] + … + a[i − 1].
  lessons: [dsa.u2.l7]

- id: prefix-arithmetic
  short: "Recheck the running total: add one value at a time."
  explain: |
    P[i + 1] = P[i] + a[i].
  lessons: [dsa.u2.l7]

- id: prefix-no-zero
  short: "The prefix array starts with P[0] = 0, so it has n + 1 entries."
  explain: |
    P[0] is the empty prefix; P[n] is the whole array.
  lessons: [dsa.u2.l7]

- id: prefix-doubles
  short: "There is one prefix per length 0 … n: n + 1 entries."
  explain: |
    Nothing is stored twice.
  lessons: [dsa.u2.l7]

- id: prefix-zero-language
  short: "Nothing in the language requires the 0 — it's a design choice to avoid a special case."
  explain: |
    With P[0] = 0, every range is P[r + 1] − P[l].
  lessons: [dsa.u2.l7]

- id: prefix-padding
  short: "The extra 0 has a precise job: it represents the empty prefix."
  explain: |
    It makes ranges starting at index 0 follow the same formula.
  lessons: [dsa.u2.l7]

- id: range-formula-off
  short: "Subtracting an earlier prefix includes an extra value on the left."
  explain: |
    sum(a[l … r]) = P[r + 1] − P[l].
  lessons: [dsa.u2.l7]

- id: range-formula-low
  short: "P[r] stops before a[r] — use P[r + 1] to include it."
  explain: |
    sum(a[l … r]) = P[r + 1] − P[l].
  lessons: [dsa.u2.l7]

- id: average-subtract
  short: "Averages over different lengths don't subtract — subtract sums, then divide."
  explain: |
    Average = (P[r + 1] − P[l]) / (r − l + 1).
  lessons: [dsa.u2.l7]

- id: prefix-precomputes-all
  short: "P stores prefixes only, not every range's answer — each question still takes a subtraction."
  explain: |
    Storing every range would take O(n²) space.
  lessons: [dsa.u2.l7]

- id: prefix-rebuild
  short: "Build P once, before any question — not once per question."
  explain: |
    Then each question is a single subtraction: O(n + q).
  lessons: [dsa.u2.l7]

- id: prefix-always-better
  short: "Setup isn't free: with one short question, the plain loop is cheaper."
  explain: |
    Compare n + q with the total length of the ranges asked.
  lessons: [dsa.u2.l7]

- id: prefix-q-greater
  short: "More questions make prefix sums *more* worthwhile, not less."
  explain: |
    The O(n) setup is shared by every question.
  lessons: [dsa.u2.l7]

- id: prefix-needs-positive
  short: "Prefix sums work with negative values — subtraction is exact for any numbers."
  explain: |
    Only the operation must be invertible.
  lessons: [dsa.u2.l7]

- id: diff-end-included
  short: "The cancelling update goes at r + 1, just after the range ends."
  explain: |
    D[r] −= v would remove the bonus from day r itself.
  lessons: [dsa.u2.l7]

- id: diff-adds-per-day
  short: "A difference array touches two entries per update, whatever the range length."
  explain: |
    The running sum spreads the change over l … r.
  lessons: [dsa.u2.l7]

- id: diff-sign
  short: "The −v at r + 1 only cancels the +v after the range; inside the range the value is +v."
  explain: |
    Running sums: 0 before l, v from l to r, 0 after.
  lessons: [dsa.u2.l7]

- id: diff-two-per-day
  short: "Two updates per range, not two per day — that's the point of the trick."
  explain: |
    Then one final pass of n: O(n + q).
  lessons: [dsa.u2.l7]

- id: prefix-max
  short: "Max has no inverse, so it can't be found by subtracting prefixes."
  explain: |
    Range maxima need other tools (sparse tables, segment trees).
  lessons: [dsa.u2.l7]

- id: prefix-median
  short: "A median needs the actual values in the range, not their total."
  explain: |
    Prefix arrays only help for sums and similar invertible operations.
  lessons: [dsa.u2.l7]

- id: prefix-sorted
  short: "Sortedness depends on neighbouring pairs, not on a total."
  explain: |
    You could prefix-count "descents" — but a plain prefix sum of values doesn't tell you.
  lessons: [dsa.u2.l7]

- id: prefix-update-one
  short: "Changing one value changes every prefix that includes it."
  explain: |
    Prefix arrays suit data that doesn't change between questions.
  lessons: [dsa.u2.l7]

- id: diff-answers-sums
  short: "A difference array makes range updates O(1), but a range sum then needs a pass over D."
  explain: |
    Each trick moves the O(n) cost to the other operation.
  lessons: [dsa.u2.l7]

- id: prefix-both-arrays
  short: "Keeping both doesn't help: every update would still have to rebuild P."
  explain: |
    Interleaved updates and queries need a tree structure, O(log n) each.
  lessons: [dsa.u2.l7]

- id: prefix-one-read
  short: "A range needs two prefixes: everything through r, minus everything before l."
  explain: |
    sum(a[l … r]) = P[r + 1] − P[l] — two reads and one subtraction.
  lessons: [dsa.u2.l7]
