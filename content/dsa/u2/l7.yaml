      solution:
        python: |
          def apply_updates(n, updates):
              d = [0] * (n + 1)
              for l, r, v in updates:
                  d[l] += v
                  d[r + 1] -= v
              out, run = [], 0
              for i in range(n):
                  run += d[i]
                  out.append(run)
              return out
        javascript: |
          function applyUpdates(n, updates) {
            const d = new Array(n + 1).fill(0);
            for (const [l, r, v] of updates) {
              d[l] += v;
              d[r + 1] -= v;
            }
            const out = [];
            let run = 0;
            for (let i = 0; i < n; i++) out.push((run += d[i]));
            return out;
          }
      explanation: |
        Two writes per update plus one final pass: $O(n + q)$. The running sum is the prefix sum of the changes.

summary:
  keyTakeaways:
    - "P[0] = 0, P[i + 1] = P[i] + a[i]; then sum(a[l … r]) = P[r + 1] − P[l]."
    - "Build once in O(n), answer each question in O(1): O(n + q) instead of O(nq)."
    - "Difference array: D[l] += v, D[r + 1] −= v; a running sum rebuilds the values."
    - "Prefix sums need invertible operations (sum, count, XOR) and data that doesn't change between questions."
