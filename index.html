<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Practice-first adaptive lessons for college maths, physics and computer science."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Fieldly</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('fieldly:progress') || 'null');
        var t = p && p.settings && p.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var s = p && p.settings && p.settings.fontScale;
        if (s) document.documentElement.style.fontSize = 100 * s + '%';
        if (p && p.settings && p.settings.reducedMotion) document.documentElement.dataset.motion = 'reduce';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
