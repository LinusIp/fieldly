      hints:
        nudge: "Two pointers finds the smallest `i` that has *some* partner. Which partner index does it land on?"
        buildsOn: "From Q2: discards are safe, so the first match has the smallest possible `i`."
        partial: "When you match at (lo, hi), the smallest j has the same value: move left while prices[hi − 1] == prices[hi] and hi − 1 > lo."
      solution:
        python: |
          def pair_sum(prices, target):
              lo, hi = 0, len(prices) - 1
              while lo < hi:
                  s = prices[lo] + prices[hi]
                  if s == target:
                      while hi - 1 > lo and prices[hi - 1] == prices[hi]:
                          hi -= 1
                      return [lo, hi]
                  if s < target:
                      lo += 1
                  else:
                      hi -= 1
              return []
        javascript: |
          function pairSum(prices, target) {
            let lo = 0, hi = prices.length - 1;
            while (lo < hi) {
              const s = prices[lo] + prices[hi];
              if (s === target) {
                while (hi - 1 > lo && prices[hi - 1] === prices[hi]) hi--;
                return [lo, hi];
              }
              if (s < target) lo++;
              else hi--;
            }
            return [];
          }
      explanation: |
        The first match has the smallest possible `i`: every discarded `lo` had no partner (Q2). Its partner value is fixed
        (`target − a[lo]`), so the smallest `j` is the leftmost copy of that value after `lo` — a short walk left from `hi`.

summary:
  keyTakeaways:
    - "Brute-force pair search checks n(n − 1)/2 pairs: O(n²)."
    - "On sorted data, two pointers moves lo right when the sum is too small and hi left when it's too large: at most n − 1 sums."
    - "It never misses a pair: a discarded value's best possible partner already failed."
    - "Unsorted input costs O(n log n) to sort first; keep original indices with the values if you need them."
