          - { args: [""], expected: 0 }
          - { args: ["aaaa"], expected: 1 }
          - { args: ["abba"], expected: 2, hidden: true }
        comparator: exact
      check: { expr: "passed == total" }
      feedback:
        - { if: "passed == 0", say: "None pass yet. Start with: the empty string has length 0." }
        - { if: "passed < total", say: "Some tests fail — check `abba`: the left end must never move back.", misconception: window-last-inside }
        - { if: "true", say: "Run the tests and read the failures." }
      hints:
        nudge: "Any correct method works here — even trying every start."
        buildsOn: "From Q5: j adds a letter; i moves past the earlier copy."
        partial: "Keep a set of the window's letters; while s[j] is in it, remove s[i] and move i."
      solution:
        python: |
          def longest_unique(s):
              seen = set()
              best = i = 0
              for j, ch in enumerate(s):
                  while ch in seen:
                      seen.remove(s[i])
                      i += 1
                  seen.add(ch)
                  best = max(best, j - i + 1)
              return best
        javascript: |
          function longestUnique(s) {
            const seen = new Set();
            let best = 0, i = 0;
            for (let j = 0; j < s.length; j++) {
              while (seen.has(s[j])) seen.delete(s[i++]);
              seen.add(s[j]);
              best = Math.max(best, j - i + 1);
            }
            return best;
          }
      explanation: |
        The set holds exactly the window's letters. Each letter is added once and removed at most once: $O(n)$.
