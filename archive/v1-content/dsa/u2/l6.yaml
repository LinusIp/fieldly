        - { if: "not perfPassed", say: "Correct but too slow: extending from every start costs about n × L. Slide the window instead.", misconception: window-quadratic }
        - { if: "true", say: "Run the tests again." }
      hints:
        nudge: "Never restart from scratch — keep the window and fix it."
        buildsOn: "From Q6: each end moves at most n times."
        partial: "Map each letter to its last index; on a repeat, `i = max(i, last[ch] + 1)`."
      solution:
        python: |
          def longest_unique(s):
              last = {}
              best = i = 0
              for j, ch in enumerate(s):
                  if ch in last and last[ch] >= i:
                      i = last[ch] + 1
                  last[ch] = j
                  best = max(best, j - i + 1)
              return best
        javascript: |
          function longestUnique(s) {
            const last = new Map();
            let best = 0, i = 0;
            for (let j = 0; j < s.length; j++) {
              const p = last.get(s[j]);
              if (p !== undefined && p >= i) i = p + 1;
              last.set(s[j], j);
              best = Math.max(best, j - i + 1);
            }
            return best;
          }
      explanation: |
        With `last`, the left end jumps straight past the repeat: one step per character, $O(n)$ — about 30 000 steps instead of
        tens of millions.

summary:
  keyTakeaways:
    - "n values hold n − k + 1 windows of length k; recomputing each costs O(nk)."
    - "Fixed window: total += entering − leaving — O(1) per slide, O(n) overall."
    - "Variable window: j always advances; i advances only to fix the rule — at most 2n moves, O(n)."
    - "Use i = max(i, last[ch] + 1): stale positions must never move the left end back."
