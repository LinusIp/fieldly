summary:
  keyTakeaways:
    - "Arrays are contiguous: element i is at B + s·i, so indexing is O(1)."
    - "Inserting or deleting at index k shifts the elements after k: O(n − k); the front is the worst case, O(n)."
    - "Append and pop() at the end are fast (amortized O(1)); insert(0, x) and pop(0) are O(n)."
    - "Repeated front operations add up to O(n²) — use collections.deque for fast operations at both ends."
