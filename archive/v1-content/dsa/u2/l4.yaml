summary:
  keyTakeaways:
    - "A queue is FIFO: enqueue at the back, dequeue from the front."
    - "list.pop(0) shifts everything (O(n)); use collections.deque or a circular buffer for O(1)."
    - "Circular buffer: back = (head + size) mod C; dequeue reads head and advances it; nothing shifts."
    - "A deque gives O(1) at both ends; deque(maxlen=N) silently drops the oldest item when full."
  next: dsa.u2.l5
