challenge:
  id: dsa.u1.l2.ch
  type: code-runner
  title: "Count the iterations"
  concept: loop-analysis
  uses: [s4, s5]
  variants:
    easier:
      difficulty: 2
      goal: |
        Write `count_pairs(n)` returning how many times `work()` runs in this code:

        ```python
        for i in range(n):
            for j in range(i + 1, n):
                work()
        ```
      config:
        entry: { python: count_pairs, javascript: countPairs }
        starter:
          python: |
            def count_pairs(n):
                # Return how many times work() runs for this n.
                return 0
          javascript: |
            function countPairs(n) {
              // Return how many times work() runs for this n.
              return 0;
            }
        tests:
          - { args: [0], expected: 0 }
          - { args: [1], expected: 0 }
          - { args: [2], expected: 1 }
          - { args: [5], expected: 10 }
          - { args: [12], expected: 66, hidden: true }
        comparator: exact
      check: { expr: "passed == total" }
      feedback:
        - { if: "passed == 0", say: "None of the tests pass yet. Try counting with two loops, exactly like the code." }
        - { if: "passed < total", say: "Some tests fail. Check small cases by hand: for n = 5, the inner loop runs 4 + 3 + 2 + 1 + 0 times.", misconception: pairs-include-self }
        - { if: "true", say: "Not quite — run the tests and read the failures." }
      hints:
        nudge: "You can simulate the loops and count, or find a formula."
        buildsOn: "From Q4: the count is n(n − 1)/2."
        partial: "Python: `return n * (n - 1) // 2`."
      solution:
        python: |
          def count_pairs(n):
              count = 0
              for i in range(n):
                  for j in range(i + 1, n):
                      count += 1
              return count
        javascript: |
          function countPairs(n) {
            let count = 0;
            for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) count++;
            return count;
          }
      explanation: |
        Simulating the loops works; so does the formula $n(n-1)/2$ from Q4. Both give 10 for $n = 5$.
    standard:
      difficulty: 3
      goal: |
        Write `count_triples(n)` returning how many times `work()` runs here:

        ```python
        for i in range(n):
            for j in range(i + 1, n):
                for m in range(j + 1, n):
                    work()
        ```
      config:
        entry: { python: count_triples, javascript: countTriples }
        starter:
          python: |
            def count_triples(n):
                return 0
          javascript: |
            function countTriples(n) {
              return 0;
            }
        tests:
          - { args: [0], expected: 0 }
          - { args: [2], expected: 0 }
          - { args: [3], expected: 1 }
          - { args: [5], expected: 10 }
          - { args: [20], expected: 1140, hidden: true }
        comparator: exact
      check: { expr: "passed == total" }
      feedback:
        - { if: "passed == 0", say: "None of the tests pass yet. For n = 3 there is exactly one triple: (0, 1, 2)." }
        - { if: "passed < total", say: "Close. Remember each loop starts one past the previous index — no repeats and no reordering.", misconception: pairs-ordered }
        - { if: "true", say: "Run the tests and compare with the expected values." }
      hints:
        nudge: "Each run is one way to pick three increasing indices."
        buildsOn: "From Q4: three dependent loops count the ways to choose 3 of n."
        partial: "$\\binom{n}{3} = n(n-1)(n-2)/6$."
      solution:
        python: |
          def count_triples(n):
              return n * (n - 1) * (n - 2) // 6
        javascript: |
          function countTriples(n) {
            return (n * (n - 1) * (n - 2)) / 6;
          }
      explanation: |
        Each run is a choice of three increasing indices, so the count is $\binom{n}{3} = n(n-1)(n-2)/6$ — 1140 for $n = 20$.
        Still $O(n^3)$ work if you run the loops, but $O(1)$ with the formula.
    harder:
      difficulty: 4
      goal: |
        `count_pairs(n)` again (the two-loop version) — but now it must handle **n = 1 000 000 000** within
        half a second. Simulating the loops won't finish; find the count directly.
      config:
        entry: { python: count_pairs, javascript: countPairs }
        starter:
          python: |
            def count_pairs(n):
                return 0
          javascript: |
            function countPairs(n) {
              return 0;
            }
        tests:
          - { args: [0], expected: 0 }
          - { args: [5], expected: 10 }
          - { args: [100], expected: 4950 }
          - { args: [100000], expected: 4999950000, hidden: true }
        comparator: float
        perf: { generator: dependentLoopCount, params: { n: 1000000000 }, timeLimitMs: 500 }
      check: { expr: "passed == total and perfPassed" }
      feedback:
        - { if: "passed < total", say: "Some tests fail — get the small cases right first." }
        - { if: "not perfPassed", say: "Correct, but too slow for n = 10⁹: the loops run about 5 × 10¹⁷ times. Use the formula.", misconception: loops-add-not-multiply }
        - { if: "true", say: "Run the tests again." }
      hints:
        nudge: "What closed-form expression counts the pairs?"
        buildsOn: "From Q4: the count is n(n − 1)/2."
        partial: "Return `n * (n - 1) // 2` (Python) or `n * (n - 1) / 2` (JavaScript)."
      solution:
        python: |
          def count_pairs(n):
              return n * (n - 1) // 2
        javascript: |
          function countPairs(n) {
            return (n * (n - 1)) / 2;
          }
      explanation: |
        The formula $n(n-1)/2$ answers in $O(1)$ time. Simulating the loops is $O(n^2)$ — about $5 \times 10^{17}$
        steps for $n = 10^9$, which would take years.

summary:
  keyTakeaways:
    - "Count how many times the loop body runs; then simplify to Big-O."
    - "Stepping by a constant is still $O(n)$; doubling or halving gives $O(\\log n)$."
    - "Nested loops multiply, sequential loops add — and dependent nested loops are still $O(n^2)$."
    - "Check boundaries: `range` excludes its stop value; doubling loops include `i = 1`."
  next: dsa.u1.l3
