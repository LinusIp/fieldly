challenge:
  id: calc1.u1.l5.ch
  type: graph-manipulator
  title: "Trap the root"
  concept: intermediate-value-theorem
  uses: [s4, s5]
  params:
    sets:
      - { k: 3 }
      - { k: 5 }
      - { k: 9 }
  derived:
    # A few Newton steps from 1.5 give the root of x³ + x − k to machine precision (for the reference solution only).
    r1: "1.5 - (1.5^3 + 1.5 - k) / (3 * 1.5^2 + 1)"
    r2: "r1 - (r1^3 + r1 - k) / (3 * r1^2 + 1)"
    r3: "r2 - (r2^3 + r2 - k) / (3 * r2^2 + 1)"
    r4: "r3 - (r3^3 + r3 - k) / (3 * r3^2 + 1)"
    r5: "r4 - (r4^3 + r4 - k) / (3 * r4^2 + 1)"
    root: "r5 - (r5^3 + r5 - k) / (3 * r5^2 + 1)"
  variants:
    easier:
      difficulty: 2
      goal: |
        $f(x) = x^3 + x - {{k}}$ has a root in $(1, 2)$. Move $x$ until $f$ changes sign between $x - 0.05$ and $x + 0.05$ — then a root
        lies within 0.05 of $x$. Zoom with $w$.
      config:
        f: "x^3 + x - k"
        view: { x: ["x0 - w", "x0 + w"], y: ["-(3*x0^2 + 1) * w * 1.2", "(3*x0^2 + 1) * w * 1.2"] }
        controls:
          - { name: x0, label: "x", min: 1, max: 2, step: 0.001, initial: 1 }
          - { name: w, label: "zoom w", min: 0.01, max: 1, step: 0.01, initial: 1 }
        overlays: { band: { y: 0, eps: 0, x: "x0" } }
      check: { expr: "f(x0 - 0.05) * f(x0 + 0.05) < 0" }
      feedback:
        - { if: "fx0 < 0", say: "f(x) is still negative here: the root is further right.", misconception: bisection-wrong-half }
        - { if: "true", say: "f(x) is positive here: the root is further left.", misconception: bisection-wrong-half }
      hints:
        nudge: "The sign of f(x) tells you which side the root is on."
        buildsOn: "From Q4: a sign change between two points traps a root."
        partial: "f is increasing: negative → move right; positive → move left."
      solution: { x0: "root", w: 0.1 }
      explanation: |
        A sign change between $x - 0.05$ and $x + 0.05$ means (by the IVT) a root in that interval of length 0.1.
    standard:
      difficulty: 3
      goal: |
        Same $f(x) = x^3 + x - {{k}}$, but pin the root to within **0.01**: $f$ must change sign between $x - 0.01$ and $x + 0.01$.
      config:
        f: "x^3 + x - k"
        view: { x: ["x0 - w", "x0 + w"], y: ["-(3*x0^2 + 1) * w * 1.2", "(3*x0^2 + 1) * w * 1.2"] }
        controls:
          - { name: x0, label: "x", min: 1, max: 2, step: 0.001, initial: 2 }
          - { name: w, label: "zoom w", min: 0.005, max: 1, step: 0.005, initial: 1 }
        overlays: { band: { y: 0, eps: 0, x: "x0" } }
      check: { expr: "f(x0 - 0.01) * f(x0 + 0.01) < 0" }
      feedback:
        - { if: "f(x0 - 0.05) * f(x0 + 0.05) < 0", say: "Within 0.05 — now zoom in further and halve your bracket a few more times." }
        - { if: "fx0 < 0", say: "f(x) is negative: the root is to the right.", misconception: bisection-wrong-half }
        - { if: "true", say: "f(x) is positive: the root is to the left.", misconception: bisection-wrong-half }
      hints:
        nudge: "Bisect: check the sign at the midpoint, keep the half with the sign change."
        buildsOn: "From Q5: seven halvings take a length-1 bracket below 0.01."
        partial: "Zoom in (smaller w) as the bracket shrinks."
      solution: { x0: "root", w: 0.02 }
      explanation: |
        Seven halvings of $[1, 2]$ get below 0.01 — the IVT guarantees the root stays trapped at every step.
    harder:
      difficulty: 4
      goal: |
        $g(x) = x^3 - 3x + 1$ has **three** roots. Trap the one in $(1, 2)$ to within **0.005**: $g$ must change sign between
        $x - 0.005$ and $x + 0.005$.
      config:
        f: "x^3 - 3*x + 1"
        view: { x: ["x0 - w", "x0 + w"], y: ["-(abs(3*x0^2 - 3) + 1) * w * 1.2", "(abs(3*x0^2 - 3) + 1) * w * 1.2"] }
        controls:
          - { name: x0, label: "x", min: -2, max: 2, step: 0.001, initial: -2 }
          - { name: w, label: "zoom w", min: 0.005, max: 2, step: 0.005, initial: 2 }
        overlays: { band: { y: 0, eps: 0, x: "x0" } }
      check: { expr: "x0 > 1 and f(x0 - 0.005) * f(x0 + 0.005) < 0" }
      feedback:
        - { if: "x0 <= 1 and f(x0 - 0.005) * f(x0 + 0.005) < 0", say: "That's a root — but not the one in (1, 2).", misconception: ivt-uniqueness }
        - { if: "true", say: "Check g(1) and g(2): where is the sign change between them?" }
      hints:
        nudge: "g(1) = −1 and g(2) = 3."
        buildsOn: "From Q6: the IVT promises a root in (1, 2) — not that it's the only root overall."
        partial: "g(1.5) = −0.125, so the root is in (1.5, 2)."
      solution: { x0: "2 * cos(2 * pi / 9)", w: 0.01 }
      explanation: |
        The three roots are $2\cos\frac{2\pi}{9} \approx 1.532$, $2\cos\frac{4\pi}{9}$ and $2\cos\frac{8\pi}{9}$. Bisection on $[1, 2]$ finds the
        first — the IVT promised one there, nothing more.

summary:
  keyTakeaways:
    - "Continuous at a: f(a) defined, the limit exists, and they're equal."
    - "Removable (hole), jump (sides differ), infinite (blow-up) discontinuities."
    - "IVT: a continuous f on [p, q] takes every value between f(p) and f(q) — at least once, location unknown."
    - "Bisection halves a sign-change bracket each step: n steps shrink length L to L/2ⁿ."
  next: calc1.u1.l6
