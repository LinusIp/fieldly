challenge:
  id: calc1.u1.l6.ch
  type: graph-manipulator
  title: "Close in on a trig limit"
  concept: trig-limits
  uses: [s3, s4]
  params:
    sets:
      - { k: 2 }
      - { k: 3 }
      - { k: 4 }
  variants:
    easier:
      difficulty: 2
      goal: |
        $\dfrac{\sin x}{x} \to 1$ as $x \to 0$. Drag $x$ toward 0 (zoom with $w$) until **every** point between $x$ and 0 lies within
        $\varepsilon = 0.05$ of 1.
      config:
        f: "sin(x) / x"
        view: { x: ["-w", "w"], y: ["1 - 1.3 * w^2 / 6 - 0.06", "1 + 0.06 + 0.1 * w"] }
        controls:
          - { name: x0, label: "x", min: -2, max: 2, step: 0.001, initial: 2, drag: true }
          - { name: w, label: "zoom w", min: 0.05, max: 2.5, step: 0.05, initial: 2.5 }
        overlays: { band: { y: 1, eps: 0.05, x: 0 } }
      check: { expr: "x0 != 0 and maxDev(min(x0, 0), max(x0, 0), 1) < 0.05" }
      feedback:
        - { if: "x0 == 0", say: "x approaches 0 but never equals it — sin(0)/0 is undefined.", misconception: limit-equals-value }
        - { if: "true", say: "Part of the curve between x and 0 is outside the band. Move x closer to 0." }
      hints:
        nudge: "Where does the curve leave the band?"
        buildsOn: "From Q3: sin x / x → 1."
        partial: "sin x / x ≈ 1 − x²/6, so |x| below about 0.5 works."
      solution: { x0: 0.4, w: 0.6 }
      explanation: |
        $\frac{\sin x}{x} \approx 1 - \frac{x^2}{6}$ near 0, so the gap shrinks like $x^2$ — fast.
    standard:
      difficulty: 3
      goal: |
        Move the dashed line $y = L$ to $\lim_{x \to 0} \dfrac{\sin({{k}}x)}{x}$, then drag $x$ toward 0 until every point between $x$ and 0
        is within $\varepsilon = 0.01$ of $L$.
      config:
        f: "sin(k*x) / x"
        view: { x: ["-w", "w"], y: ["k - 1.3 * k^3 * w^2 / 6 - 0.05", "k + 0.05 + 0.2 * w"] }
        controls:
          - { name: L, min: 0, max: 6, step: 0.5, initial: 1 }
          - { name: x0, label: "x", min: -1, max: 1, step: 0.001, initial: 1, drag: true }
          - { name: w, label: "zoom w", min: 0.01, max: 1, step: 0.01, initial: 1 }
        overlays: { band: { y: "L", eps: 0.01, x: 0 } }
      check: { expr: "L == k and x0 != 0 and maxDev(min(x0, 0), max(x0, 0), L) < 0.01" }
      feedback:
        - { if: "L == 1", say: "The inside is kx, not x — the limit isn't 1.", misconception: trig-limit-ignores-inner }
        - { if: "L != k", say: "Find the limit first: sin(kx)/x = k · sin(kx)/(kx)." }
        - { if: "true", say: "L is right. Now get x close enough that the whole stretch fits in the band." }
      hints:
        nudge: "First the value of the limit, then the zoom."
        buildsOn: "From Q3: sin(kx)/x → k."
        partial: "sin({{k}}x)/x ≈ {{k}} − {{k^3}}x²/6: |x| below about √(0.06/{{k^3}})."
      solution: { L: "k", x0: "0.7 * sqrt(0.06 / k^3)", w: 0.1 }
      explanation: |
        $\frac{\sin {{k}}x}{x} = {{k}} \cdot \frac{\sin {{k}}x}{ {{k}}x} \to {{k}}$; near 0 it's about ${{k}} - \frac{ {{k^3}} x^2}{6}$, so a
        larger ${{k}}$ needs a smaller $x$.
    harder:
      difficulty: 4
      goal: |
        Move $y = L$ to $\lim_{x \to 0} \dfrac{1 - \cos({{k}}x)}{x^2}$, then get every point between $x$ and 0 within $\varepsilon = 0.01$ of $L$.
      config:
