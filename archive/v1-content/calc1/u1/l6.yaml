        view: { x: ["-w", "w"], y: ["k^2/2 - 1.3 * k^4 * w^2 / 24 - 0.05", "k^2/2 + 0.05 + 0.2 * w"] }
        controls:
          - { name: L, min: 0, max: 10, step: 0.5, initial: 0.5 }
          - { name: x0, label: "x", min: -1, max: 1, step: 0.001, initial: -1, drag: true }
          - { name: w, label: "zoom w", min: 0.01, max: 1, step: 0.01, initial: 1 }
        overlays: { band: { y: "L", eps: 0.01, x: 0 } }
      check: { expr: "L == k^2/2 and x0 != 0 and maxDev(min(x0, 0), max(x0, 0), L) < 0.01" }
      feedback:
        - { if: "L == 0.5", say: "1/2 is the limit for cos(x) — here the inside is kx.", misconception: trig-limit-ignores-inner }
        - { if: "L == k/2", say: "x² = u²/k², so the factor is k², not k.", misconception: trig-inner-not-squared }
        - { if: "L != k^2/2", say: "Find the limit first: substitute u = kx." }
        - { if: "true", say: "L is right. Now close in on 0." }
      hints:
        nudge: "Substitute u = {{k}}x."
        buildsOn: "From Q4: (1 − cos u)/u² → 1/2."
        partial: "The limit is {{k^2}}/2; near 0 the gap is about {{k^4}}x²/24."
      solution: { L: "k^2/2", x0: "-0.7 * sqrt(0.24) / k^2", w: 0.1 }
      explanation: |
        $\frac{1 - \cos {{k}}x}{x^2} = {{k^2}} \cdot \frac{1 - \cos u}{u^2} \to \frac{ {{k^2}} }{2}$, with a gap of about $\frac{ {{k^4}} x^2}{24}$.

summary:
  keyTakeaways:
    - "Squeeze: g ≤ f ≤ h with g, h → L forces f → L — ideal for bounded wiggles times something going to 0."
    - "lim sin x / x = 1 and lim (1 − cos x)/x = 0 as x → 0, in radians."
    - "Match the inside: sin(kx)/x → k; (1 − cos kx)/x² → k²/2."
    - "At infinity, substitute u = 1/x to turn limits into ones at 0."
  next: calc1.u1.l7
